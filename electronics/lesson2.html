<style>
/* VOICE everyday learning, a workbench lesson for a software engineer
   IDEA the rail of his own robot-arm board sags when the servos lunge; a capacitor is a tank that covers the gap
   PICTURE live 3D board from level 1 plus bulk capacitors and an oscilloscope; a water tank fed through a narrow pipe for charge, τ = R × C and discharge
   COLOUR night bench #050817, solder-mask green, copper, water blue, red for + and danger
   TYPE Manrope 800 + Manrope
   LAYOUT laptop: 3D stage left, lesson column 410px right; phone: stage on top, lesson below; only the controls a step needs are shown */
:root{color-scheme:dark;--bg:#050817;--panel:#0a1230;--card:#0e1840;--line:#1e2a5c;--ink:#eef1ff;--mute:#8f9bc4;--cu:#e39a52;--hot:#ff5a3c;--ok:#5fd38d;--warn:#ffc14d}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%}
.stage{position:relative;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;font:600 13px/1.2 Manrope,sans-serif;padding:3px 8px;border-radius:6px;background:rgba(5,8,23,.82);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.lb.big{font-size:15px;color:#ffd1c4;border-color:#6b2a1c}
.lb.flow{color:#bfe3ff;border-color:#24496b}
.lb.lvl{background:none;border:0;color:var(--mute);font-size:12px;padding:0}
.lb.bad{color:#ffb39f;border-color:#6b2a1c}
.lb.good{color:#9ff0c0;border-color:#2f4a9e}
.lb.dim{color:var(--mute);border-style:dashed;font-weight:400}
.tools{position:absolute;left:16px;top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.reset{min-height:36px;font-size:14px;background:rgba(14,22,60,.9)}
.hint{font-size:13px;color:var(--mute);background:rgba(5,8,23,.7);padding:4px 10px;border-radius:8px}
.info{position:absolute;right:16px;top:14px;width:min(300px,calc(100% - 32px));background:rgba(14,22,60,.96);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.info b{display:block;font-size:15px;margin:0 28px 4px 0}
.info p{margin:0;color:#c9d2f5}
.x{position:absolute;right:6px;top:4px;width:32px;height:32px;min-height:0;padding:0;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;border-radius:8px}
.panel{overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);padding:22px 20px 28px}
h1{font:800 31px/1.06 Manrope,sans-serif;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.sub{margin:0 0 16px;color:var(--mute);font-size:15px}
.card,.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.stephead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mute);font-size:13px;font-weight:600;flex-wrap:wrap}
.part{color:var(--cu)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:13px;height:13px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer}
.dots button.on{background:var(--ink);border-color:var(--ink)}
.dots button.done{border-color:var(--ok)}
.dots button.on.done{background:var(--ok)}
h2{font:800 22px/1.15 Manrope,sans-serif;margin:8px 0 8px;letter-spacing:-.01em}
.stepb p,.stepb ol,.stepb ul{margin:0 0 10px}
.stepb ol,.stepb ul{padding-left:20px}
.stepb li{margin-bottom:4px}
.stepb .note{font-size:14px;color:var(--mute)}
.stepb b{color:#fff}
.after{border-left:3px solid var(--ok);padding:2px 0 2px 12px;margin:0 0 10px}
.after p{margin:0 0 8px}
.task{border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;background:#151d45;border:1px solid #2e3a78;color:var(--warn)}
.task.ok{color:var(--ok);border-color:#2f4a9e;background:#0f1d4a}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
button{font:600 15px Manrope,sans-serif;color:var(--ink);background:#141f4d;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
button:hover{border-color:#33407a}
button:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
button.pri{background:var(--ink);color:#050817;border-color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
.ctl label{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px;margin-top:4px}
output{color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--cu);cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row>*{flex:1 1 140px}
.row button[aria-pressed=true]{border-color:var(--ok);color:var(--ok)}
.danger{background:#3a1b14;border-color:#a33d22;color:#ffd1c4}
.fix{width:100%;margin-top:4px;background:#3a1b14;border-color:#6b2a1c;color:#ffb39f}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.num span{display:block;font-size:13px;color:var(--mute)}
.num b{font:800 22px/1.2 Manrope,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.num.u b{color:#ff8a70}.num.i b{color:#8fd0ff}.num.p b{color:#ff6a4d}.num.g b{color:#9ff0c0}
.st{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 0}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.g{color:var(--ok);border-color:#2f4a9e}.pill.y{color:var(--warn);border-color:#5a4a1f}.pill.r{color:#ff8a70;border-color:#6b2a1c}.pill.m{color:var(--mute)}
.formula{grid-column:1/-1;margin:0;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.6;color:#c9d2f5}
.hw{list-style:none;padding:0!important;margin:0 0 10px}
.hw li{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:14px}
.hw input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.err{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);padding:20px;text-align:center}
@media(max-width:900px){
html,body{height:auto}
.app{grid-template-columns:minmax(0,1fr);height:auto}

}

.lead{font-size:16px;line-height:1.5;margin:0 0 12px}.lead b{color:#fff}
.step .card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 0 4px;margin:0 0 10px}
.step .after{margin:10px 0 0}
.stepx:empty{display:none}.stepx{margin-top:12px}.stepx p{margin:0 0 10px}
.stepx table{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 10px}
.more{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}

.blk{background:#131c46;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.blk h3{margin:0 0 4px;font:800 12px/1.3 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--cu)}
.blk p,.blk ul,.blk ol{margin:0 0 6px}.blk>:last-child{margin-bottom:0}
.blk ul,.blk ol{padding-left:20px}
.blk b{color:#fff}
.blk.note{background:none;border-style:dashed;color:var(--mute);font-size:14px}

.blk th{text-align:left;color:var(--mute);font-weight:600;font-size:13px;border-bottom:1px solid var(--line);padding:4px 6px 4px 0}
.blk td{border-bottom:1px solid var(--line);padding:5px 6px 5px 0;vertical-align:top}
.hud{position:absolute;right:12px;bottom:12px;display:flex;flex-flow:row wrap;justify-content:flex-end;align-content:flex-end;gap:6px;max-width:min(460px,calc(100% - 24px));pointer-events:none;background:none;border:0;padding:0;margin:0}
.hud .num{display:flex;align-items:baseline;gap:10px;background:rgba(5,8,23,.86);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.hud .num span{display:inline;font-size:12px}
.hud .num b{font-size:18px}
.hud .st{margin:0;justify-content:flex-end;flex:1 0 100%}.hud .pill{background:rgba(5,8,23,.86)}
.hud .formula{border:1px solid var(--line);border-radius:10px;background:rgba(5,8,23,.86);padding:7px 10px;font-size:13px;line-height:1.5;text-align:right}
.hud .formula:empty{display:none}
@media(max-width:900px){.hud{right:8px;bottom:8px;gap:4px;max-width:calc(100% - 16px)}.hud .num{padding:2px 8px}.hud .num span{font-size:11px}.hud .num b{font-size:15px}.hud .formula{font-size:11px;padding:5px 8px;max-width:100%}}

/* panel v2: one header line, segmented progress, goal row, sticky footer */
.app{grid-template-columns:minmax(0,1fr) 384px}

.prog{margin:0 0 2px}
.ptop{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}

#stepC{font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;flex-wrap:nowrap}

h2{font-size:23px;margin:10px 0 6px}

.task .tick{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--warn);margin-top:0;position:relative}
.task.ok{background:#0d1a45;border-color:#2f4a9e;color:#dbe2ff}

.more summary .cnt{font-weight:600;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:2px}

.lvl-done{margin:0 20px 12px!important}

<style>

STEPS=[
{sc:'b',part:'Problem',t:'The arm lunges, the rail sags',s:"All six servos start at once and grab about 7 A extra within microseconds. A multimeter averages over a third of a second, so it can’t see what happens next. An <b>oscilloscope</b> can: it draws voltage against time.",bt:["What happens","The oscilloscope","The red line","The jump at the end"],ui:['jerk','scope','nI','nV','pills','bF'],build:B(false,0,1),enter:()=>{fresh();S.plugged=S.servos=true},
 b:'<p>The board from level 1: 12 V supply, fuse, MOSFET, the rail, the indicator, the meter, six servos. Steady, the servos draw 1.8 A and the rail sits at 11.9 V. Now they all start at once: +7 A within 20 microseconds. The supply’s control loop and its cable can’t raise the current that fast. For those microseconds the servos take current that hasn’t arrived yet, and the voltage sags.</p><p>A multimeter averages over about a third of a second, so it never sees a dip that lasts a millisecond. An <b>oscilloscope</b> draws voltage against time: up is volts, across is time. Here one square across is 0.5 ms. It catches one event and freezes it, like a photo.</p><p>Later this rail feeds a regulator that makes 3.3 V for the ESP32 (level 4). It needs some headroom above its output; we take <b>7 V</b> as its floor. Dip below it, even for a millisecond, and the brain reboots: the arm forgets what it was doing.</p><p>When the servos let go, the supply is still pushing the extra current and it has nowhere to go: the rail jumps above 12 V. Same cause, other direction.</p>',
 after:'<p>The rail fell to about 5 V for a fraction of a millisecond, below the 7 V line. The meter didn’t even twitch. Then, when the servos let go, the rail shot to about 20 V. The supply isn’t broken: nothing on the board covers the gap while it catches up. We need a small reserve of charge right on the rail.</p>',
 task:'Make the arm lunge and read the lowest voltage on the scope',ok:()=>S.fl.j0},
{sc:'w',part:'Capacitor',t:'A capacitor is a tank',s:"A <b>capacitor</b> stores charge the way a tank stores water, so it can hand some back when the supply can’t keep up. The level is the voltage across it; the width is its <b>capacitance</b>, C, in farads.",bt:["Inside", "Q = C × U", "Discharge"],ui:['wMode','wnU','wnI','scope','wF'],enter:()=>{S.wr=2;S.wc=3;S.wm='drain';S.lvl=0;S.wlog=[];S.wt=0;S.fl.full=S.fl.empty=false},
 b:"<p>Two metal plates with a thin insulator between them. No current crosses the gap: charge piles up on one plate and leaves the other, so from outside it looks as if current flows in.</p><p>Charge <b>Q = C × U</b>: capacitance times voltage, like width times height gives volume. One farad is huge; real parts come in microfarads: 1 µF = 0.000001 F.</p><p>Turn the pump off and the source drops to 0 V. Now the tank is higher, and its own level pushes the water back through the same narrow pipe. The tank has become the source.</p>",
 after:"<p>Filling, the flow started fast and faded to nothing. The flow through the narrow pipe depends on the difference in levels, I = (12 V − U) / R, and that difference shrinks as the tank fills. When the levels match, nothing flows: a full capacitor passes no steady current.</p><p>Emptying went the same way, fast then slow. Remember the shape: it shows up everywhere a capacitor meets a resistor.</p>",
 task:'Turn the pump on and wait until the flow stops, then turn it off',ok:()=>S.fl.full&&S.fl.empty},
{sc:'w',part:'Capacitor',t:'How fast: τ = R × C',s:"How fast does a tank fill? The time scale is <b>τ = R × C</b>: ohms times farads gives seconds. After one τ the tank is 63% full.",bt:["τ, tau","The curve","Why it matters"],ui:['wR','wC','wMode','wnTau','scope'],enter:()=>{S.wr=2;S.wc=1;S.wm='drain';S.lvl=0;S.wlog=[];S.wt=0;S.run=null;S.fl.tau=false},
 b:'<p><b>τ</b> (tau) = R × C. Ohms times farads comes out in seconds: 1 kΩ × 1000 µF = 1000 × 0.001 = 1 s.</p><table><tr><th>Time</th><th>Filled</th></tr><tr><td>1 τ</td><td>63%</td></tr><tr><td>2 τ</td><td>86%</td></tr><tr><td>3 τ</td><td>95%</td></tr><tr><td>5 τ</td><td>99%, call it full</td></tr></table><p>In every τ the tank closes 63% of the gap that’s left. Emptying follows the same curve.</p><p>On the board the “narrow pipe” is the supply’s slowness, and the tank is a capacitor on the rail. A bigger tank sags less while the supply catches up. That’s next.</p>',
 after:"<p>At one τ the level crossed the orange 63% line, and by five τ it was full. A wider tank or a narrower pipe both stretch τ: double either and filling takes twice as long.</p><p>Any pair with R × C = 1 s does the same: 1 kΩ × 1000 µF, 2.2 kΩ × 470 µF, 4.7 kΩ × 220 µF.</p>",
 task:'Set τ to about 1 s, then fill the tank from empty',ok:()=>S.fl.tau},
{sc:'b',part:'On the board',t:'A tank on the rail',s:"An electrolytic capacitor goes between +12 V and ground. When the servos lunge, it gives up charge while the supply catches up.",bt:["Where it goes","Why not as big as possible","ESR","On your real board"],ui:['capC','jerk','scope','nI','nV','pills','bF'],build:B(true,0,1),enter:()=>{fresh();S.plugged=S.servos=true;S.ri=3;S.tr=null;S.rp=1},
 b:'<p>Between +12 V and ground, in parallel with everything else, like the indicator. It doesn’t carry the servo current in series; it sits beside the rail as a reserve.</p><p>Bigger cans cost more, take space, and draw a big inrush current when you plug in. Pick what the numbers need, plus a margin.</p><p>A real capacitor has a narrow neck: a few hundredths of an ohm inside it, called <b>ESR</b>. The dip can never go below the current jump × ESR, however big the tank.</p><p class="note">Put it as close to the servo connector as you can on your real board. The copper in between has its own inertia (level 3).</p>',
 after:'<p>1000 µF keeps the dip to about 0.8 V. 470 µF lets it reach about 1.1 V, and with nothing it’s almost 7 V. Notice the size of the jump at the end shrank too: the tank also soaks up the extra current when the servos let go.</p>',
 task:'Find the smallest capacitor that keeps the dip under 1 V',ok:()=>S.last&&S.last.dip<1&&S.last.C<=1.001e-3},
{sc:'b',part:'On the board',t:'Size it on paper',s:"The tank gives away <b>C × ΔU</b>; the servos take <b>I × Δt</b>. Set them equal: <b>C = I × Δt / ΔU</b>. Example: a 3 A jump, 0.2 ms to catch up, 0.5 V allowed: 3 × 0.0002 / 0.5 = 0.0012 F = 1200 µF.",bt:["Where it comes from","How exact is it"],ui:['capC','cap2','jerk','scope','nV','pills','bF'],build:B(true,5,1),enter:()=>{fresh();S.plugged=S.servos=true;S.ri=3},
 b:'<p>The tank gives away its width times the drop in level: <b>C × ΔU</b>. The load takes current times time: <b>I × Δt</b>. Until the supply catches up, all of it comes from the tank, so C × ΔU = I × Δt.</p><p>The supply isn’t idle for all of Δt; it ramps up. So this is an estimate, but a good one, and it errs on the safe side.</p><p class="qq">Your arm: the servos jump by <b>7 A</b>, the supply needs <b>0.15 ms</b> to catch up, the dip must stay under <b>1 V</b>. How many µF do you need?</p><div class="quiz"><input id="qa" inputmode="decimal" placeholder="C, in µF" aria-label="Answer in microfarads"><button id="qb">Check</button></div><p class="fb" id="qf"></p>',
 after:'<p>Paper and bench agree: about 1000 µF. We fit two in parallel. Capacitances in parallel add, like two tanks side by side: 2000 µF. The dip drops to about 0.65 V, and there’s margin for the day the cans age: electrolytics lose capacitance over the years.</p>',
 task:'Work out C for your arm (below), then fit two 1000 µF in parallel and make the arm lunge',ok:()=>S.quiz&&S.last&&S.last.C>1.99e-3&&S.last.C<2.01e-3},
