<style>
/* VOICE everyday learning, a workbench lesson for a software engineer
   IDEA the rail of his own robot-arm board sags when the servos lunge; a capacitor is a tank that covers the gap
   PICTURE live 3D board from level 1 plus bulk capacitors and an oscilloscope; a water tank fed through a narrow pipe for charge, τ = R × C and discharge
   COLOUR night bench #050817, solder-mask green, copper, water blue, red for + and danger
   TYPE Manrope 800 + Manrope
   LAYOUT laptop: 3D stage left, lesson column 410px right; phone: stage on top, lesson below; only the controls a step needs are shown */
:root{color-scheme:dark;--bg:#050817;--panel:#0a1230;--card:#0e1840;--line:#1e2a5c;--ink:#eef1ff;--mute:#8f9bc4;--cu:#e39a52;--hot:#ff5a3c;--ok:#5fd38d;--warn:#ffc14d}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%}
.stage{position:relative;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;font:600 13px/1.2 Manrope,sans-serif;padding:3px 8px;border-radius:6px;background:rgba(5,8,23,.82);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.lb.big{font-size:15px;color:#ffd1c4;border-color:#6b2a1c}
.lb.flow{color:#bfe3ff;border-color:#24496b}
.lb.lvl{background:none;border:0;color:var(--mute);font-size:12px;padding:0}
.lb.bad{color:#ffb39f;border-color:#6b2a1c}
.lb.good{color:#9ff0c0;border-color:#2f4a9e}
.lb.dim{color:var(--mute);border-style:dashed;font-weight:400}
.tools{position:absolute;left:16px;top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.reset{min-height:36px;font-size:14px;background:rgba(14,22,60,.9)}
.hint{font-size:13px;color:var(--mute);background:rgba(5,8,23,.7);padding:4px 10px;border-radius:8px}
.info{position:absolute;right:16px;top:14px;width:min(300px,calc(100% - 32px));background:rgba(14,22,60,.96);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.info b{display:block;font-size:15px;margin:0 28px 4px 0}
.info p{margin:0;color:#c9d2f5}
.x{position:absolute;right:6px;top:4px;width:32px;height:32px;min-height:0;padding:0;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;border-radius:8px}
.panel{overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);padding:22px 20px 28px}
h1{font:800 31px/1.06 Manrope,sans-serif;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.sub{margin:0 0 16px;color:var(--mute);font-size:15px}
.card,.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.stephead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mute);font-size:13px;font-weight:600;flex-wrap:wrap}
.part{color:var(--cu)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:13px;height:13px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer}
.dots button.on{background:var(--ink);border-color:var(--ink)}
.dots button.done{border-color:var(--ok)}
.dots button.on.done{background:var(--ok)}
h2{font:800 22px/1.15 Manrope,sans-serif;margin:8px 0 8px;letter-spacing:-.01em}
.stepb p,.stepb ol,.stepb ul{margin:0 0 10px}
.stepb ol,.stepb ul{padding-left:20px}
.stepb li{margin-bottom:4px}
.stepb .note{font-size:14px;color:var(--mute)}
.stepb b{color:#fff}
.after{border-left:3px solid var(--ok);padding:2px 0 2px 12px;margin:0 0 10px}
.after p{margin:0 0 8px}
.task{border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;background:#151d45;border:1px solid #2e3a78;color:var(--warn)}
.task.ok{color:var(--ok);border-color:#2f4a9e;background:#0f1d4a}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
button{font:600 15px Manrope,sans-serif;color:var(--ink);background:#141f4d;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
button:hover{border-color:#33407a}
button:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
button.pri{background:var(--ink);color:#050817;border-color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
.ctl label{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px;margin-top:4px}
output{color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--cu);cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row>*{flex:1 1 140px}
.row button[aria-pressed=true]{border-color:var(--ok);color:var(--ok)}
.danger{background:#3a1b14;border-color:#a33d22;color:#ffd1c4}
.fix{width:100%;margin-top:4px;background:#3a1b14;border-color:#6b2a1c;color:#ffb39f}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.num span{display:block;font-size:13px;color:var(--mute)}
.num b{font:800 22px/1.2 Manrope,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.num.u b{color:#ff8a70}.num.i b{color:#8fd0ff}.num.p b{color:#ff6a4d}.num.g b{color:#9ff0c0}
.st{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 0}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.g{color:var(--ok);border-color:#2f4a9e}.pill.y{color:var(--warn);border-color:#5a4a1f}.pill.r{color:#ff8a70;border-color:#6b2a1c}.pill.m{color:var(--mute)}
.formula{grid-column:1/-1;margin:0;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.6;color:#c9d2f5}
.hw{list-style:none;padding:0!important;margin:0 0 10px}
.hw li{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:14px}
.hw input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.err{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);padding:20px;text-align:center}
@media(max-width:900px){
html,body{height:auto}
.app{grid-template-columns:minmax(0,1fr);height:auto}
.stage{height:62svh;min-height:360px}
.panel{border-left:0;border-top:1px solid var(--line);padding:18px 16px 28px}
.hint{display:none}
.info{right:10px;top:10px}
.lb{font-size:11px;padding:2px 5px}
.lb.part{display:none!important}
}

.lead{font-size:16px;line-height:1.5;margin:0 0 12px}.lead b{color:#fff}
.step .card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 0 4px;margin:0 0 10px}
.step .after{margin:10px 0 0}
.stepx:empty{display:none}.stepx{margin-top:12px}.stepx p{margin:0 0 10px}
.stepx table{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 10px}
.more{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.more summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:40px;font-weight:700;font-size:15px;color:var(--mute)}
.more summary::-webkit-details-marker{display:none}

.blocks{display:grid;gap:8px;margin-top:4px}
.blk{background:#131c46;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.blk h3{margin:0 0 4px;font:800 12px/1.3 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--cu)}
.blk p,.blk ul,.blk ol{margin:0 0 6px}.blk>:last-child{margin-bottom:0}
.blk ul,.blk ol{padding-left:20px}
.blk b{color:#fff}
.blk.note{background:none;border-style:dashed;color:var(--mute);font-size:14px}
.blk.note h3{color:var(--mute)}

.blk th{text-align:left;color:var(--mute);font-weight:600;font-size:13px;border-bottom:1px solid var(--line);padding:4px 6px 4px 0}
.blk td{border-bottom:1px solid var(--line);padding:5px 6px 5px 0;vertical-align:top}
.hud{position:absolute;right:12px;bottom:12px;display:flex;flex-flow:row wrap;justify-content:flex-end;align-content:flex-end;gap:6px;max-width:min(460px,calc(100% - 24px));pointer-events:none;background:none;border:0;padding:0;margin:0}
.hud .num{display:flex;align-items:baseline;gap:10px;background:rgba(5,8,23,.86);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.hud .num span{display:inline;font-size:12px}
.hud .num b{font-size:18px}
.hud .st{margin:0;justify-content:flex-end;flex:1 0 100%}.hud .pill{background:rgba(5,8,23,.86)}
.hud .formula{border:1px solid var(--line);border-radius:10px;background:rgba(5,8,23,.86);padding:7px 10px;font-size:13px;line-height:1.5;text-align:right}
.hud .formula:empty{display:none}
@media(max-width:900px){.hud{right:8px;bottom:8px;gap:4px;max-width:calc(100% - 16px)}.hud .num{padding:2px 8px}.hud .num span{font-size:11px}.hud .num b{font-size:15px}.hud .formula{font-size:11px;padding:5px 8px;max-width:100%}}

/* panel v2: one header line, segmented progress, goal row, sticky footer */
.app{grid-template-columns:minmax(0,1fr) 384px}
.panel{display:flex;flex-direction:column;padding:0}
.ph{display:flex;align-items:baseline;gap:10px;padding:16px 20px 0;font-size:13px;color:var(--mute);flex-wrap:wrap}
.ph .ltitle{color:var(--ink);font-weight:700;font-size:14px}
.ph .back{margin:0;font-size:13px}
.step{background:none;border:0;border-radius:0;padding:14px 20px 10px;margin:0;flex:1 0 auto}
.prog{margin:0 0 2px}
.ptop{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.ptop .part{color:var(--cu)}
#stepC{font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;flex-wrap:nowrap}
.dots button{flex:1 1 0;height:16px;min-height:0;padding:0;border:0;border-radius:0;cursor:pointer;background:linear-gradient(var(--line),var(--line)) center/100% 5px no-repeat}
.dots button.pb{margin-left:7px}

.dots button.on.done{background-image:linear-gradient(var(--ok),var(--ok))}
.dots button:hover{background-size:100% 7px}
h2{font-size:23px;margin:10px 0 6px}
.lead{margin:0 0 6px}
.step .card{border-top:0;padding:6px 0 0;margin:0 0 6px}
.task{display:flex;gap:10px;align-items:flex-start;background:#121b48;border:1px solid #2e3a78;border-radius:12px;padding:10px 12px;color:var(--ink);font-size:15px;font-weight:600;line-height:1.4}
.task .tick{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--warn);margin-top:0;position:relative}
.task.ok{background:#0d1a45;border-color:#2f4a9e;color:#dbe2ff}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.more summary .cnt{font-weight:600;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:2px}
.nav{position:sticky;bottom:0;z-index:3;margin:0;padding:12px 20px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px}
.nav #prev{flex:none;width:48px;padding:0;font-size:22px;line-height:1}
.nav #next{flex:1}
.lvl-done{margin:0 20px 12px!important}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.ph{padding:14px 16px 0}.step{padding:12px 16px 8px}.nav{padding:10px 16px calc(10px + env(safe-area-inset-bottom))}}
/* polish v2 */
.lb{font-weight:500;font-size:12px;line-height:16px;padding:2px 7px;color:#dfe4fb;background:rgba(6,10,30,.86);border-color:rgba(255,255,255,.08)}

/* brand v1 */
:root{--blue:#5b9cff;--violet:#8a6bff;--grad:linear-gradient(100deg,#5b9cff,#8a6bff 60%,#c77dff);--ok:#59f3a8;--warn:#ffb26b}

<style>
/* level 3: the scope with two traces, the coil */
.scope{position:absolute;left:16px;bottom:16px;width:min(420px,calc(100% - var(--pw,0px) - 40px));padding:12px 14px 12px;border-radius:16px;background:rgba(10,15,40,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(140,160,255,.16);pointer-events:none}

.scope .lg>span{display:grid;grid-template-columns:14px auto;column-gap:6px;align-items:baseline}.scope .lg>span>i{margin:0!important;align-self:center}.scope .lg em{display:block;font-style:normal;color:#8f9bc4}

<div class="app">
  <section class="stage" id="stage">
    <canvas id="gl" aria-label="3D model of the lesson"></canvas>
    <div class="labels" id="labels"></div>
    <figure class="scope" id="scope" data-ui="scope" aria-label="Oscilloscope">
      <figcaption class="sh"><b id="scT">Oscilloscope</b><span id="scS"></span><span class="rd" id="scR" aria-live="polite"></span></figcaption>
      <canvas id="scv" role="img" aria-label="Voltage and current over time"></canvas>

rrent going and drives the switch node as far as it takes. With nowhere to go, that’s hundreds of volts and a spark."}, "4": {"q": "With the diode fitted, when the switch opens the coil’s current…", "o": ["stops at once", "keeps circling through the diode and fades", "flows back into the supply"], "a": 1, "ex": "The diode gives the current a loop: coil → lamp → ground → diode → coil. It fades with τ = L / R instead of spiking."}, "5": {"q": "You flip the switch on and off fast, closed half the time. The lamp gets…", "o": ["12 V flashes, 20,000 a second", "a steady voltage of about 6 V", "nothing"], "a": 1, "ex": "The coil won’t let the current change fast, so the lamp sees the average: about half of 12 V. That’s how a switching regulator works."}, "6": {"q": "You swap in a coil ten times lighter. The lamp’s average voltage…", "o": ["drops a lot", "stays about the same", "rises"], "a": 1, "ex": "The average is set by D: the share of time the lamp is connected to 12 V. A lighter coil only lets the current wobble more around that average."}}, "recall": {"0": [{"q": "1 kΩ and 1000 µF give τ =", "o": ["1 ms", "1 s", "1000 s"], "a": 1, "ex": "τ = R × C = 1000 × 0.001 = 1 s."}, {"q": "A capacitor won’t let this jump instantly:", "o": ["its voltage", "its current"], "a": 0, "ex": "Its level can only change as charge flows in or out."}, {"q": "A Schottky diode passes current…", "o": ["both ways", "towards the stripe, dropping about 0.45 V", "only above 12 V"], "a": 1}], "3": [{"q": "τ = L / R for 10 mH and 10 Ω is…", "o": ["1 µs", "1 ms", "1 s"], "a": 1, "ex": "0.01 / 10 = 0.001 s."}, {"q": "Shutting the valve faster makes the kick…", "o": ["smaller", "bigger"], "a": 1}]}, "end": {"step": 9, "items": [{"q": "A coil won’t let this jump instantly:", "o": ["its voltage", "its current"], "a": 1}, {"q": "1 mH, and the current changes by 1 A in 1 µs. U =", "o": ["1 mV", "1 V", "1000 V"], "a": 2, "ex": "0.001 × 1 / 0.000001 = 1000 V."}, {"q": "Where does the flyback diode go?", "o" STEPS=[
{sc:'w',part:'Inertia',t:'A coil is a heavy wheel',s:"A <b>coil</b> (inductor) is wire wound in loops. Switching regulators, motors and relays are all built around coils. In water it’s a <b>heavy paddle wheel</b> in the pipe.",bt:["Inside", "The heavy wheel", "Units, and the slow motion"],ui:['wValve','wNote','wnI','wnU','scope','wF'],enter:()=>{S.wl=2;S.wr=1;S.wv='closed';S.wI=0;S.wt=0;S.wlog=[];S.kick=null;S.fl.full=false},
 b:"<p>Current through a coil builds a magnetic field, and the field stores energy. Coils are often wound on a ferrite or iron core to pack more of it in.</p><p>To get the water moving you also have to spin up the wheel, and that takes time. Once it spins, it costs nothing.</p><p class=\"note\">Inductance L is in henries (H); real coils are microhenries (µH) to millihenries (mH): 1 mH = 0.001 H. This scene runs 1000 times slower than real life: 1 ms on the scope takes a second.</p>",
 after:"<p>The flow climbed and settled at I = U / R = 12 V / 10 Ω = 1.2 A. At the start the whole 12 V went into spinning up the wheel; at the end the wheel took nothing.</p><p>So a coil doesn’t resist current, it resists <b>changes</b> in current. A capacitor holds its voltage; a coil holds its current.</p>",
 task:'Open the valve and wait until the flow levels off',ok:()=>S.fl.full},
{sc:'w',part:'Inertia',t:'How fast: τ = L / R',s:"How fast does the flow build up? The time scale is <b>τ = L / R</b>: henries over ohms gives seconds. After one τ the flow reaches 63% of its final value.",bt:["The same curve as the capacitor", "The push-back"],ui:['wL','wR','wValve','wNote','wnTau','scope'],enter:()=>{S.wl=0;S.wr=1;S.wv='closed';S.wI=0;S.wt=0;S.wlog=[];S.run=null;S.kick=null;S.fl.tau=false},
 b:"<p>It’s the 63% curve from the capacitor in level 2. There the voltage crept up; here the current does.</p><p>The wheel pushes back with <b>U = L × ΔI / Δt</b>. At the start the whole 12 V goes into spinning it up; as the flow settles, the push-back fades to zero.</p>",
 after:"<p>At one τ the flow crossed the orange 63% line. A heavier wheel takes longer: double L and τ doubles. Any pair with L / R = 1 ms does the same: 10 mH with 10 Ω, 22 mH with 22 Ω, 4.7 mH with 4.7 Ω.</p><p>Less resistance makes τ longer, not shorter. That feels backwards, but the final current U / R is bigger, and the wheel needs longer to get there.</p>",
 task:'Set τ to about 1 ms, then open the valve from rest',ok:()=>S.fl.tau},
{sc:'w',part:'Inertia',t:'Stop it suddenly: the kick',s:"What happens at the valve if you shut it while the heavy wheel spins? Close it slowly first, then slam it.",bt:["Water hammer", "Who gives up first", "Where the energy goes"],ui:['wValve2','wNote','wnI','wnKick','scope','wF'],enter:()=>{S.wl=2;S.wr=1;S.wv='closed';S.wI=0;S.wt=0;S.wlog=[];S.kick=null;S.fl.slow=S.fl.slam=false},
 b:"<p>Plumbers call it <b>water hammer</b>: shut a tap fast and the pipes bang.</p><p>Long before 12 000 V something breaks down: air sparks, a transistor dies.</p><p class=\"note\">The spinning wheel holds energy, E = ½ × L × I². When you stop it, that energy has to go somewhere.</p>",
 after:"<p>The wheel can’t stop instantly, so it drives the pressure as high as it takes: <b>U = L × ΔI / Δt</b>. Closing over 0.5 ms: 0.01 H × 1.2 A / 0.0005 s = 24 V on top of the pump. Slamming in 1 µs: 0.01 × 1.2 / 0.000001 = 12 000 V.</p><p>On a board the same spike lands on whatever cut the circuit: a switch contact or a transistor.</p>",
 task:'Open the valve and close it slowly, then open it again and slam it shut',ok:()=>S.fl.slow&&S.fl.slam},
{sc:'b',part:'On the board',t:'Switching off a coil',s:"A test circuit on the arm board: 12 V → switch → <b>coil</b> → lamp → ground. The scope probe sits on <b>SW</b>, the switch node between the switch and the coil. Close the switch, let the current build, then open it.",bt:["The test circuit","The kick","Who dies","-"],ui:['bSw','scope','nI','nSW','pills','bF'],build:{diode:'none'},enter:()=>{S.bl=2;S.sw=false;S.Ib=0;S.fuse=false;S.pwm=false;S.fl.spike=S.fl.on=false},
 b:'<p>The 12 V rail, a switch, a 2.2 mH coil and a 12 V lamp of about 24 Ω. The scope probe sits on <b>SW</b>, the switch node between the switch and the coil. Close the switch and the current climbs with τ = 2.2 mH / 24 Ω ≈ 0.09 ms, up to 0.5 A.</p><p>Open it and the 0.5 A has nowhere to go. The coil drives SW far below ground, until the gap breaks down and sparks. Across the switch: hundreds of volts.</p><p>A mechanical switch survives a spark; its contacts just wear. A transistor, which switches loads on a real board (level 5), is rated for 30–60 V and dies on the first kick.</p><p class="note">The spike here is limited by an arc of about 1 kΩ. In real life its height depends on what breaks down first.</p>',
 after:'<p>SW dived to about −500 V: over 500 V across the open switch, and a spark. Motors, relays and solenoids are coils too, and every one of them does this when you switch it off.</p>',
 task:'Close the switch, then open it and watch the scope',ok:()=>S.fl.spike},
{sc:'b',part:'On the board',t:'Flyback diode',s:"When the switch opens, the coil’s current needs somewhere to go. Fit a Schottky diode from ground to SW, stripe towards SW, and switch off again.",bt:["While closed", "Backwards", "Everywhere"],ui:['bDiode','bSw','scope','nI','nSW','pills','bF'],build:{diode:'none'},enter:()=>{S.bl=2;S.sw=false;S.Ib=0;S.fuse=false;S.pwm=false;S.fl.calm=false},
 b:"<p>While the switch is closed, the diode does nothing at all: it only works in the instant after switching off.</p><p>Fit it backwards and it’s a short from 12 V to ground the moment the switch closes. The fuse from level 1 blows and saves the board.</p><p class=\"note\">On relays and motors this part is called a flyback or freewheeling diode. Every relay module has one next to the coil.</p>",
 after:"<p>SW stopped at −0.45 V and the lamp faded out within about 0.3 ms (3τ). The current kept circling coil → lamp → ground → diode, fading with τ = L / R. No spike, no spark.</p><p><b>Why not both loops at once?</b> While the switch is closed, SW is at +12 V and the diode’s other end at ground, so it’s pushed shut: a one-way valve, not a shortcut. Open the switch and the supply drops out of the loop, so the diode is the only path left.</p><p><b>The minus isn’t backwards.</b> −0.45 V is where SW sits relative to ground. The current still flows the same way through the coil; what flipped is the voltage across the coil. Now the coil is the pump, and its inlet sits below ground.</p>",
 task:'Fit the diode, close the switch, then open it',ok:()=>S.fl.calm},
{sc:'b',part:'Towards the regulator',t:"Switching fast: D sets the average",s:"Now the switch flips 20,000 times a second. <b>D</b>, the duty cycle, is the share of each cycle it spends closed: D = 30% means closed 30% of the time. What does the lamp get?",bt:["Ramp up, ramp down"],ui:['bDuty','scope','nAvg','pills','bF'],build:{diode:'ok'},enter:()=>{S.bl=3;S.duty=0.3;S.fuse=false;S.pwm=true;S.pw=pwmWave();S.ph=0},
 b:"<p>While the switch is closed, the current ramps up. While it’s open, the current keeps flowing through the diode and ramps down. On a real board a transistor does the switching (level 5).</p>",
 after:"<p>The coil won’t let the current jump, so the lamp gets the <b>average</b>: about D × 12 V. D = 50% gives about 6 V. The measured value is a little lower because, while the switch is open, the diode takes its 0.45 V.</p><p>The other 6 V aren’t burnt as heat in a resistor: the switch is either fully on or fully off, and neither wastes much.</p>",
 task:"Set D so the lamp gets about 6 V",ok:()=>S.pw&&S.pw.vl>=5.5&&S.pw.vl<=6.5},
{sc:'b',part:'Towards the regulator',t:"The coil sets the ripple",s:"D stays at 50%. The second knob is the coil, L. Start with the lightest coil, try heavier ones, and watch both the lamp’s average and the wobble.",bt:["Next"],ui:['bL','scope','nAvg','nRip','pills','bF'],build:{diode:'ok'},enter:()=>{S.bl=0;S.duty=0.5;S.fuse=false;S.pwm=true;S.pw=pwmWave();S.ph=0},
 b:"<p class=\"note\">Add the capacitor from level 2 at the output to smooth the voltage too, and you have a <b>buck converter</b>: 12 V in, 5 V out, almost no heat. That’s level 4.</p>",
 after:"<p>The average stayed at about 6 V with every coil: <b>D sets the average, L doesn’t</b>. The coil sets the <b>ripple</b>, how much the current wobbles around that average: ΔI ≈ (12 V − U) × D / (f × L). Too light, and the current swings by more than its average every cycle, and the lamp flickers.</p><p>You just built the heart of a switching regulator.</p>",
 task:"Pick L to bring the ripple under 20% of the average",ok:()=>S.pw&&S.bl>0&&S.pw.rip/S.pw.avg<0.2},
{sc:'b',part:'Towards the regulator',t:'Size it on paper',s:"<b>U = L × ΔI / Δt</b>. Example: a 1 mH coil with 5 V across it; in 1 ms its current grows by 5 × 0.001 / 0.001 = 5 A.",bt:["Rearranged","Units"],ui:['scope'],build:{diode:'ok'},enter:()=>{S.bl=3;S.duty=0.5;S.pwm=true;S.pw=pwmWave()},
 b:'<p>Rearranged: <b>Δt = L × ΔI / U</b> (how long a change takes) and <b>ΔI = U × Δt / L</b> (how much it changes).</p><p>Henries × amps / volts = seconds. Microhenries give microseconds.</p><p class="qq">A 100 µH coil has 12 V across it. How long until its current grows by 0.5 A?</p><div class="quiz"><input id="qa" inputmode="decimal" placeholder="Δt, in µs" aria-label="Time in microseconds"><button id="qb">Check</button></div><p class="fb" id="qf"></p>',
 after:'<p>About 4 µs. Coils in switching regulators are sized exactly like this: decide how much ripple you allow, then L = U × Δt / ΔI.</p>',
 task:'Work out the time (below)',ok:()=>S.quiz},
{sc:'b',part:"Practice",t:"Problem book",s:"Seven problems from real life, from a worked example to finding someone else’s slip. Hints are free; there are no lives to lose.",bt:[],ui:[],build:{diode:'ok'},enter:()=>{S.bl=3;S.duty=0.5;S.pwm=true;S.pw=pwmWave()},
 b:"<div class=\"book\" data-book=\"l3\"></div>",
 task:"Solve every problem (hints are fine)",ok:()=>BOOK.solved("l3")},
{sc:'b',part:'Wrap-up',t:'What we built, and homework',s:"A coil holds its current, kicks back when you cut it, and smooths it when you switch fast.",bt:["-","Next"],ui:[],build:{diode:'ok'},enter:()=>{S.bl=3;S.duty=0.5;S.pwm=true;S.pw=pwmWave()},
 b:_t('<p>The test circuit: 12 V → switch → coil → lamp, with a flyback diode from ground to SW. Switched fast, it gives the lamp a steady share of 12 V. That’s a buck converter without its output capacitor.</p>')+'<ul class="hw">'+['Find the coils on any DC-DC module or charger board: toroids, or square black blocks printed 100, 220 or 4R7. 100 means 10 µH, 220 is 22 µH, 4R7 is 4.7 µH.','Find a relay module and spot the flyback diode next to the relay.','A 47 µH coil has 7 V across it. How many microseconds until its current rises by 1 A?','Measure the coil resistance of a 12 V relay or motor you own (Ω range). That R and its L set τ = L / R.'].map((t,i)=>`<li><input type="checkbox" id="hw${i}" ${hw[i]?'checked':''}><label for="hw${i}">${_t(t)}</label></li>`).join('')+'</ul>'+_t('<p class="note">Next up, level 4: the regulator. Linear and buck: why one heats up and the other doesn’t.</p>'),
 task:'Tick all four items',ok:()=>[0,1,2,3].every(i=>hw[i])}];

    else if(v>=3.9e-6&&v<=4.4e-6)m='That’s in seconds. A microsecond is a millionth: multiply by 1 000 000.';

    else if(v>=230&&v<=250||v>=2.3e5&&v<=2.5e5)m='Flipped: Δt = L × ΔI / U. Coil times current on top, the voltage below.';

  Lcoil.el.textContent=_t('Coil · {0}',fL(BL[S.bl]));Llamp.el.textContent=_t('Lamp · 12 V');Ld.el.textContent=_t(dd==='rev'?'Diode · backwards!':C.V<-0.1?'Flyback diode · conducting':'Flyback diode · shut');Ld.el.className='lb '+(dd==='rev'?'bad':'part');
  $('#bsw').textContent=_t(S.sw?'Open the switch':'Close the switch');$('#bsw').disabled=!!(S.cap&&S.rp<1);

  $('#nI').textContent=fI(C.I);$('#nSW').textContent=fV(C.V);

  const pills=[];

      pills.push(S.pw&&S.pw.vl>=5.5&&S.pw.vl<=6.5?['g','About 6 V on the lamp']:['m','Aim for about 6 V'])}
    else{const c=S.cap;if(c&&S.rp>=1&&!c.closed&&c.min<-100)pills.push(['r','Spark at the switch!']);else if(c&&S.rp>=1&&!c.closed&&dd==='ok')pills.push(['g','No spike: the diode caught it']);

  let f='';const L=BL[S.bl];
  if(S.fuse)f=_t('Backwards, the diode connects 12 V straight to ground when the switch closes. The fuse blew.');
  else if(S.pwm&&S.pw)f=_t('Lamp average ≈ D × 12 V = {0} × 12 V = {1} (measured {2}). L doesn’t change it.<br>Ripple: ΔI ≈ (12 V − U) × D / (f × L) = {4}, {5}% of {3}. A bigger L, a smaller ripple.',nf(S.duty,2),fV(S.duty*VS),fV(S.pw.vl),fI(S.pw.avg),fI(S.pw.rip),nf(S.pw.avg>0?S.pw.rip/S.pw.avg*100:0,0));
  else if(st.sc==='b'&&ui.length){const c=S.cap;
    if(c&&S.rp>=1&&!c.closed)f=c.min<-100?_t('Opened: the coil drove SW to <b>{0}</b>, so <b>{1}</b> across the open switch.',fV(c.min),fV(VS-c.min)):_t('Opened: SW stopped at <b>{0}</b>; the current faded through the diode with τ = L / R = {1}.',fV(c.min),fT(L/RL));
    else f=S.sw?_t('Closed: I = U / R = 12 V / 24 Ω = 0.5 A, reached with τ = L / R = {0}<br>Energy in the coil at 0.5 A: E = ½ × L × I² = {1}',fT(L/RL),fE(0.5*L*0.25)):_t('Switch open: no current.<br>Close it and the current settles at I = U / R = 12 V / 24 Ω = 0.5 A within about 3τ, τ = L / R = {0}',fT(L/RL))}
  $('#formula').innerHTML=f;
  /* task */
  if(PED.ready(S.step)&&st.ok(C))S.done.add(S.step);saveQ();
  const okd=S.done.has(S.step);$('#task').className='task'+(okd?' ok':'');PED.after(okd);$('#task').innerHTML='<i class="tick" aria-hidden="true"></i><span><span class="sr">'+_t(okd?'Done: ':'Task: ')+'</span>'+st.task+'</span>';
  $('#after').hidden=!(okd&&st.after);if(okd&&st.after&&$('#after').dataset.s!==String(S.step)){$('#after').innerHTML=st.after;$('#after').dataset.s=S.step}
  [...$('#dots').children].forEach((bt,i)=>bt.className=(i&&STEPS[i].part!==STEPS[i-1].part?'pb ':'')+(i===S.step?'on ':'')+(S.done.has(i)?'done':''));
  drawScope();
}

/* ---------- render loop ---------- */
function size(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;gl.setSize(w,h,false);cam.aspect=w/h;const pw=window.PW?PW():0;if(w<h)cam.setViewOffset(w,h,0,-Math.round(topInset()/2),w,h);else if(pw)cam.setViewOffset(w,h,Math.round(pw/2),0,w,h);else cam.clearViewOffset();cam.updateProjectionMatrix();if(Math.abs(w-lastW)>40){lastW=w;fit()}drawScope()}
$('#reset').onclick=fit;
const ro=new ResizeObserver(size);ro.observe(stage);size();
const clock=new THREE.Clock(),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let uiT=0;
function frame(){
  const raw=Math.min(clock.getDelta(),0.25),dt=Math.min(raw,0.05),slow=reduce?0.3:1;let dirty=false;
  if(curSc==='w'){
    ctl.update();
    /* the loop in slow motion: 1 s on screen = 1 ms of real time */
    const rt=raw/SLOW,L=wLH(),R=wRo();
    if(S.wv==='open'){const sub=40,h=rt/sub;for(let i=0;i<sub;i++)S.wI+=h*(VS-R*S.wI)/L;S.wt+=rt;dirty=true;
      if(S.wI>0.95*wMax()&&!S.fl.full){S.fl.full=true;S.need=true}
      if(S.step===1&&S.run&&Math.abs(S.run.tau-wTau())<1e-12&&S.wI>0.95*wMax()&&wTau()>=0.95e-3&&wTau()<=1.05e-3&&!S.fl.tau){S.fl.tau=true;S.need=true}}
    else if(S.wv==='closing'){S.tc+=rt;S.wt+=rt;const f=Math.max(0,1-S.tc/TCLOSE);S.wI=S.I0*f;const pk=VS-R*S.wI+L*S.I0/TCLOSE;S.kick={slam:false,peak:VS+L*S.I0/TCLOSE,I0:S.I0,at:0,show:0};
      if(S.tc>=TCLOSE){S.wv='closed';S.wI=0;S.tEv=S.wt;if(S.I0>0.8*wMax())S.fl.slow=true;S.need=true}S.wlog[S.wlog.length]=[S.wt,S.wI,pk];dirty=true}
    else if(S.wt-(S.tEv||0)<0.6e-3){S.wt+=rt;dirty=true}
    if(S.wv==='open'&&(!S.wlog.length||S.wt-S.wlog[S.wlog.length-1][0]>2e-5)){S.wlog.push([S.wt,S.wI,VS-R*S.wI>0?0:0]);if(S.wlog.length>3000)S.wlog.shift()}
    if(S.wv==='closed'&&S.wt-(S.tEv||0)<0.6e-3&&(!S.wlog.length||S.wt-S.wlog[S.wlog.length-1][0]>2e-5))S.wlog.push([S.wt,0,0]);
    const I=S.wI,sp=I>0.001?Math.min(4,0.3+3*I/1.2):0;wflow+=sp*dt*slow;impW.rotation.z-=(S.wv==='open'?2.5:0)*dt*slow;flyA+=sp*dt*slow*2.2/flyR;fly.rotation.z=-flyA;
    for(let i=0;i<NDW;i++){pathAt(WPATH,wflow+i*WPATH.T/NDW,pv);dummy.position.copy(pv);dummy.scale.setScalar(sp?1:0);dummy.updateMatrix();dropsW.setMatrixAt(i,dummy.matrix)}dropsW.instanceMatrix.needsUpdate=true;
    const gO=wValve();gate.position.set(VX,WY1+0.33*gO+0.0,0);gate.scale.y=1;stem.position.y=WY1+0.75+0.33*gO;wheelTop.position.set(VX,WY1+1.15+0.33*gO,0);
    const press=S.wv==='closing'&&S.kick?Math.min(48,S.kick.peak):S.wv==='open'?VS-wRo()*I:0;const tN=2.3-Math.min(48,press)/48*4.6;needleA+=(tN-needleA)*Math.min(1,dt*8);needle.rotation.z=needleA;
    splash.forEach(s=>{if(s.life>0){s.life-=dt*0.9;s.v.y-=dt*6;s.m.position.addScaledVector(s.v,dt);s.m.material.opacity=Math.max(0,s.life)}else s.m.material.opacity=0});
    if(S.kick&&S.kick.show>0){S.kick.show-=dt;if(S.kick.show<=0)dirty=true}
    gl.render(scW,cam);
  }else{
    ctl.update();
    if(S.cap&&S.rp<1){S.rp=Math.min(1,S.rp+raw/2.4);if(!S.cap.closed&&S.diode!=='ok'&&S.rp>S.cap.t0/S.cap.T&&sparkT<=0&&S.rp<S.cap.t0/S.cap.T+0.05){sparkT=1;boomAt(V3(-2.35,0.4,-1.8));sparks.forEach(p=>{p.life=1;p.m.position.set(-2.35,0.3,-1.8);p.v.set((Math.random()-.5)*3,1+Math.random()*2.5,(Math.random()-.5)*3)})}
      if(S.rp>=1)landed();dirty=true}
    if(S.pwm){S.ph=(S.ph+raw/1.4)%1;dirty=true}
    C=solve();
    const I=Math.abs(C.I),fw=C.V<0||(S.pwm&&C.V<1),P=fw?PFW:PON,spd=I>0.002?Math.min(10,0.6+12*I):0;flow+=spd*dt*slow;
    for(let i=0;i<NP;i++){pathAt(P,flow+i*P.T/NP,pv);dummy.position.set(pv.x,0.11,pv.z);dummy.scale.setScalar(spd?1:0);dummy.updateMatrix();parts.setMatrixAt(i,dummy.matrix)}parts.instanceMatrix.needsUpdate=true;
    const br=Math.min(1,(I*RL)*(I*RL)/144);mBulb.emissiveIntensity=br*1.6;mFil.emissiveIntensity=br*3;lampLight.intensity=br*3.5;
    flashL.intensity=flashT*10;flashL.position.copy(flashAt).add(V3(0,0.6,0));flashT=Math.max(0,flashT-dt*1.6);sparkT=Math.max(0,sparkT-dt*0.5);
    sparks.forEach(s=>{if(s.life>0){s.life-=dt*1.6;s.v.y-=dt*7;s.m.position.addScaledVector(s.v,dt);s.m.material.opacity=Math.max(0,s.life)}else s.m.material.opacity=0});
    if(S.fuse&&Math.random()<dt*4){const s=smoke.find(o=>o.life<=0);if(s){s.life=1;s.m.position.set(-4+(Math.random()-.5)*0.3,0.5,-1.8)}}
    smoke.forEach(o=>{if(o.life>0){o.life-=dt*0.55;o.m.position.y+=dt*0.7;o.m.scale.setScalar(1+(1-o.life)*2.2);o.m.material.opacity=Math.max(0,o.life*0.45)}else o.m.material.opacity=0});
    gl.render(scB,cam);
  }
  uiT+=raw;if(S.need||dirty&&uiT>0.08){S.need=false;uiT=0;update()}
  const W=stage.clientWidth,H=stage.clientHeight;
  labels.forEach(L=>{let vis=L.sc===curSc&&L.vis();if(vis){pv.copy(L.p).project(cam);vis=pv.z<1&&Math.abs(pv.x)<1.1&&Math.abs(pv.y)<1.1}
    L.el.style.display=vis?'block':'none';if(vis){let x=(pv.x*.5+.5)*W;if(L.tr===TR.up||L.tr===TR.down){const ow=L.el.offsetWidth;x=Math.max(8+ow/2,Math.min(W-(window.PW?PW():0)-8-ow/2,x))}L.el.style.transform=`translate(${x}px,${(-pv.y*.5+.5)*H}px) ${L.tr}`}});
  requestAnimationFrame(frame);
}
try{$('#more').open=localStorage.getItem('moreOpen')==='1'}catch(e){}
$('#more').addEventListener('toggle',()=>{try{localStorage.setItem('moreOpen',$('#more').open?'1':'0')}catch(e){}});
renderStep=PED.wrap(renderStep,()=>S.step);BOOK.onchange=()=>update();SCHEM.def('l3',()=>({sc:STEPS[S.step].sc,auto:S.step===STEPS.length-1,closed:!!S.sw||!!S.pwm,diode:S.diode,L:S.pwm?BL[S.bl]:2.2e-3}));function saveQ(){const need=STEPS.length-1,ok=[...Array(need).keys()].every(i=>S.done.has(i));let was=false;try{const q=JSON.parse(localStorage.getItem('quest_v1')||'{}');q.steps=q.steps||{};q.done=q.done||{};was=!!q.done[3];q.steps[3]=[...S.done];if(ok)q.done[3]=true;localStorage.setItem('quest_v1',JSON.stringify(q))}catch(e){}if(window.PED&&PED.complete)PED.complete(ok,was)}
try{(JSON.parse(localStorage.getItem('quest_v1')||'{}').steps||{})[3]?.forEach(i=>S.done.add(i))}catch(e){}
renderStep();frame();
window.__L3={S,STEPS,update,capture,pwmWave,cam,ctl};
}
}
</script>
