<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A free interactive 3D course: from Ohm’s law to the power board of a robot arm. Learn by breaking things on a virtual bench.">
<meta property="og:title" content="Electronics for a robot arm">
<meta property="og:description" content="A free interactive 3D course: from Ohm’s law to the power board of a robot arm.">

<title>Level 0: The lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning, a workbench lesson for a software engineer
   IDEA first a glass water loop that shows volts, amps, ohms and watts; then the same loop built up in copper on a board
   PICTURE live 3D: water climbing through a pump and falling through a narrow pipe; then a board where parts get added one by one
   COLOUR night bench #050817, water blue, solder-mask green, copper, voltage red (+) to blue (0), LED red, meter yellow
   TYPE Manrope 800 + Manrope, JetBrains Mono only on the meter LCD
   LAYOUT laptop: 3D stage left, lesson column 410px right; phone: stage on top, lesson below; only the controls a step needs are shown */
:root{color-scheme:dark;--bg:#050817;--panel:#0a1230;--card:#0e1840;--line:#1e2a5c;--ink:#eef1ff;--mute:#8f9bc4;--cu:#e39a52;--hot:#ff5a3c;--cold:#4aa3ff;--ok:#5fd38d;--warn:#ffc14d}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%}
.stage{position:relative;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;font:600 13px/1.2 Manrope,sans-serif;padding:3px 8px;border-radius:6px;background:rgba(5,8,23,.82);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.lb.tp{color:var(--warn);border-color:#4a3f1f}
.lb.big{font-size:15px;color:#ffd1c4;border-color:#6b2a1c}
.lb.flow{color:#bfe3ff;border-color:#24496b}
.lb.lvl{background:none;border:0;color:var(--mute);font-size:12px;padding:0}
.tools{position:absolute;left:16px;top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.reset{min-height:36px;font-size:14px;background:rgba(14,22,60,.9)}
.hint{font-size:13px;color:var(--mute);background:rgba(5,8,23,.7);padding:4px 10px;border-radius:8px}
.info{position:absolute;right:16px;top:14px;width:min(300px,calc(100% - 32px));background:rgba(14,22,60,.96);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.info b{display:block;font-size:15px;margin:0 28px 4px 0}
.info p{margin:0;color:#c9d2f5}
.x{position:absolute;right:6px;top:4px;width:32px;height:32px;min-height:0;padding:0;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;border-radius:8px}
.meter{position:absolute;left:16px;bottom:16px;width:236px;background:#f2c230;color:#1d1a10;border-radius:16px;padding:10px 12px 12px;box-shadow:0 6px 0 #a3801a,0 14px 30px rgba(0,0,0,.45)}
.mtop{display:flex;justify-content:space-between;font:800 13px Manrope,sans-serif}
.lcd{margin:6px 0 8px;background:#b8c9a2;color:#14200f;font:700 34px/1 'JetBrains Mono',monospace;text-align:right;padding:8px 10px;border-radius:7px;box-shadow:inset 0 2px 0 rgba(0,0,0,.18)}
.lcd small{font-size:16px;margin-left:4px}
.probes{display:flex;gap:12px;font-size:13px;font-weight:600}
.pr i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.next{font-size:12px;margin-top:4px;color:#4b4120}
.panel{overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);padding:22px 20px 28px}
h1{font:800 31px/1.06 Manrope,sans-serif;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.sub{margin:0 0 16px;color:var(--mute);font-size:15px}
.card,.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.stephead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mute);font-size:13px;font-weight:600;flex-wrap:wrap}
.part{color:var(--cu)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:13px;height:13px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer}
.dots button.on{background:var(--ink);border-color:var(--ink)}
.dots button.done{border-color:var(--ok)}
.dots button.on.done{background:var(--ok)}
h2{font:800 22px/1.15 Manrope,sans-serif;margin:8px 0 8px;letter-spacing:-.01em}
.stepb p,.stepb ol,.stepb ul{margin:0 0 10px}
.stepb ol,.stepb ul{padding-left:20px}
.stepb li{margin-bottom:4px}
.stepb .note{font-size:14px;color:var(--mute)}
.stepb b{color:#fff}
.stepb table{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 10px}
.stepb th{text-align:left;color:var(--mute);font-weight:600;font-size:13px;border-bottom:1px solid var(--line);padding:4px 6px 4px 0}
.stepb td{border-bottom:1px solid var(--line);padding:5px 6px 5px 0;vertical-align:top}
.after{border-left:3px solid var(--ok);padding:2px 0 2px 12px;margin:0 0 10px}
.after p{margin:0 0 8px}
.task{border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;background:#151d45;border:1px solid #2e3a78;color:var(--warn)}
.task.ok{color:var(--ok);border-color:#2f4a9e;background:#0f1d4a}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
button{font:600 15px Manrope,sans-serif;color:var(--ink);background:#141f4d;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
button:hover{border-color:#33407a}
button:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
button.pri{background:var(--ink);color:#050817;border-color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
.ctl label{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-top:4px}
output{color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--cu);cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row button{flex:1 1 140px}
.row button[aria-pressed=true]{border-color:var(--ok);color:var(--ok)}
.power{width:100%;background:#3a1b14;border-color:#a33d22;color:#ffd1c4;font-size:16px}
.fix{width:100%;margin-top:4px;background:#3a1b14;border-color:#6b2a1c;color:#ffb39f}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.num span{display:block;font-size:13px;color:var(--mute)}
.num b{font:800 22px/1.2 Manrope,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.num.u b{color:#ff8a70}.num.i b{color:#8fd0ff}.num.r b{color:#ffc14d}.num.p b{color:#ff6a4d}
.st{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 0}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.g{color:var(--ok);border-color:#2f4a9e}.pill.y{color:var(--warn);border-color:#5a4a1f}.pill.r{color:#ff8a70;border-color:#6b2a1c}.pill.m{color:var(--mute)}
.formula{grid-column:1/-1;margin:0;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.6;color:#c9d2f5}
.quiz{display:flex;gap:8px;margin:4px 0 8px}
.quiz input{flex:1;font:600 16px Manrope,sans-serif;background:#070c24;color:var(--ink);border:1px solid #33407a;border-radius:10px;padding:0 12px;min-height:44px}
.fb{font-size:14px;margin:0 0 8px}
.hw{list-style:none;padding:0!important;margin:0 0 10px}
.hw li{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:14px}
.hw input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.warnbox{font-size:14px;border-left:3px solid var(--hot);padding:4px 0 4px 10px;color:#ffc9bc;margin:0 0 10px}
.err{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);padding:20px;text-align:center}
@media(max-width:900px){
html,body{height:auto}
.app{grid-template-columns:minmax(0,1fr);height:auto}
.stage{height:62svh;min-height:360px}
.panel{border-left:0;border-top:1px solid var(--line);padding:18px 16px 28px}
.meter{width:186px;padding:8px 10px 10px;left:10px;bottom:10px}
.lcd{font-size:26px}
.hint{display:none}
.info{right:10px;top:10px}
.lb{font-size:11px;padding:2px 5px}
.lb.part{display:none!important}
.meter{width:160px}
.lcd{font-size:22px}
}

.lead{font-size:16px;line-height:1.5;margin:0 0 12px}.lead b{color:#fff}
.step .card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 0 4px;margin:0 0 10px}
.step .after{margin:10px 0 0}
.stepx:empty{display:none}.stepx{margin-top:12px}.stepx p{margin:0 0 10px}
.stepx table{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 10px}
.more{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.more summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:40px;font-weight:700;font-size:15px;color:var(--mute)}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.more[open] summary::before{transform:rotate(45deg)}
.more summary:hover{color:var(--ink)}
.blocks{display:grid;gap:8px;margin-top:4px}
.blk{background:#131c46;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.blk h3{margin:0 0 4px;font:800 12px/1.3 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--cu)}
.blk p,.blk ul,.blk ol{margin:0 0 6px}.blk>:last-child{margin-bottom:0}
.blk ul,.blk ol{padding-left:20px}
.blk b{color:#fff}
.blk.note{background:none;border-style:dashed;color:var(--mute);font-size:14px}
.blk.note h3{color:var(--mute)}
.blk table{width:100%;border-collapse:collapse;font-size:14px}
.blk th{text-align:left;color:var(--mute);font-weight:600;font-size:13px;border-bottom:1px solid var(--line);padding:4px 6px 4px 0}
.blk td{border-bottom:1px solid var(--line);padding:5px 6px 5px 0;vertical-align:top}
.hud{position:absolute;right:12px;bottom:12px;display:flex;flex-flow:row wrap;justify-content:flex-end;align-content:flex-end;gap:6px;max-width:min(460px,calc(100% - 24px));pointer-events:none;background:none;border:0;padding:0;margin:0}
.hud .num{display:flex;align-items:baseline;gap:10px;background:rgba(5,8,23,.86);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.hud .num span{display:inline;font-size:12px}
.hud .num b{font-size:18px}
.hud .st{margin:0;justify-content:flex-end;flex:1 0 100%}.hud .pill{background:rgba(5,8,23,.86)}
.hud .formula{border:1px solid var(--line);border-radius:10px;background:rgba(5,8,23,.86);padding:7px 10px;font-size:13px;line-height:1.5;text-align:right}
.hud .formula:empty{display:none}
@media(max-width:900px){.hud{right:8px;bottom:8px;gap:4px;max-width:calc(100% - 16px)}.hud .num{padding:2px 8px}.hud .num span{font-size:11px}.hud .num b{font-size:15px}.hud .formula{font-size:11px;padding:5px 8px;max-width:100%}}

/* panel v2: one header line, segmented progress, goal row, sticky footer */
.app{grid-template-columns:minmax(0,1fr) 384px}
.panel{display:flex;flex-direction:column;padding:0}
.ph{display:flex;align-items:baseline;gap:10px;padding:16px 20px 0;font-size:13px;color:var(--mute);flex-wrap:wrap}
.ph .ltitle{color:var(--ink);font-weight:700;font-size:14px}
.ph .back{margin:0;font-size:13px}
.step{background:none;border:0;border-radius:0;padding:14px 20px 10px;margin:0;flex:1 0 auto}
.prog{margin:0 0 2px}
.ptop{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.ptop .part{color:var(--cu)}
#stepC{font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;flex-wrap:nowrap}
.dots button{flex:1 1 0;height:16px;min-height:0;padding:0;border:0;border-radius:0;cursor:pointer;background:linear-gradient(var(--line),var(--line)) center/100% 5px no-repeat}
.dots button.pb{margin-left:7px}
.dots button.done{background-image:linear-gradient(#3b5bd9,#3b5bd9)}
.dots button.on{background-image:linear-gradient(var(--ink),var(--ink));background-size:100% 7px}
.dots button.on.done{background-image:linear-gradient(var(--ok),var(--ok))}
.dots button:hover{background-size:100% 7px}
h2{font-size:23px;margin:10px 0 6px}
.lead{margin:0 0 6px}
.step .card{border-top:0;padding:6px 0 0;margin:0 0 6px}
.task{display:flex;gap:10px;align-items:flex-start;background:#121b48;border:1px solid #2e3a78;border-radius:12px;padding:10px 12px;color:var(--ink);font-size:15px;font-weight:600;line-height:1.4}
.task .tick{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--warn);margin-top:0;position:relative}
.task.ok{background:#0d1a45;border-color:#2f4a9e;color:#dbe2ff}
.task.ok .tick{background:var(--ok);border-color:var(--ok)}
.task.ok .tick::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #050817;border-width:0 2px 2px 0;transform:rotate(45deg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.more summary .cnt{font-weight:600;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:2px}
.nav{position:sticky;bottom:0;z-index:3;margin:0;padding:12px 20px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px}
.nav #prev{flex:none;width:48px;padding:0;font-size:22px;line-height:1}
.nav #next{flex:1}
.lvl-done{margin:0 20px 12px!important}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.ph{padding:14px 16px 0}.step{padding:12px 16px 8px}.nav{padding:10px 16px calc(10px + env(safe-area-inset-bottom))}}
/* polish v2 */
.lb{font-weight:500;font-size:12px;line-height:16px;padding:2px 7px;color:#dfe4fb;background:rgba(6,10,30,.86);border-color:rgba(255,255,255,.08)}
.lb.tp{color:#e3b27a;border-color:rgba(255,255,255,.08)}
.lb.big{font-size:13px;border-color:rgba(255,120,90,.35)}
.lb.flow{border-color:rgba(120,180,255,.25)}
.lb.bad{border-color:rgba(255,120,90,.35)}.lb.good{border-color:rgba(95,211,141,.3)}
.meter{background:#0b1333;color:#dfe4fb;border:1px solid #6b4a2a;width:208px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.lcd{background:#c7d1b0;font-size:30px}.next{color:#8f9bc4}
.reset{min-height:32px;font-size:13px;padding:4px 12px;background:rgba(10,16,44,.8)}
.hint{transition:opacity .6s}.stage.touched .hint{opacity:0;pointer-events:none}
.row button[aria-pressed=true]{background:rgba(95,211,141,.1)}
.dots button,.dots button:hover,.dots button.on{background-size:100% 4px}
.dots button.done{background-image:linear-gradient(#34479a,#34479a)}
.dots button.on,.dots button.on.done{background-image:linear-gradient(var(--ok),var(--ok))}
.side{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.side:empty{display:none}
.side .formula{margin:0;padding:0;border:0;background:none;font-size:13px;line-height:18px;color:#a3acd0;text-align:left;font-variant-numeric:tabular-nums}
.side .formula:empty{display:none}
.side .st{margin:0;justify-content:flex-start}
@media(max-width:900px){
 .stage{height:46svh;min-height:300px}
 .meter{left:auto;right:8px;top:8px;bottom:auto;width:150px;padding:7px 9px 8px}
 .meter .lcd{font-size:20px;margin:4px 0 5px}.meter .next{display:none}
 .hud .num:nth-child(n+3){display:none}
}
/* brand v1 */
:root{--blue:#5b9cff;--violet:#8a6bff;--grad:linear-gradient(100deg,#5b9cff,#8a6bff 60%,#c77dff);--ok:#59f3a8;--warn:#ffb26b}
body{background:radial-gradient(60% 50% at 20% 0%,rgba(40,70,190,.18),transparent 70%),var(--bg)}
.panel{background:linear-gradient(180deg,#0a1230,#070c24 60%)}
h1,h2,.ltitle{font-family:Unbounded,Manrope,sans-serif;font-weight:600;letter-spacing:-.02em}
h2#stepT{font-size:clamp(19px,1.7vw,23px);line-height:1.2}
button.pri,a.go{background:#E8ECFF;color:#0A0F2E;border-color:#E8ECFF;border-radius:999px}
button.pri:hover,a.go:hover{background:#fff}
a.go.ghost{background:rgba(140,160,255,.08);color:var(--ink);border-color:rgba(140,160,255,.25)}
.dots button.on,.dots button.on.done{background-image:var(--grad)}
.dots button.done{background-image:linear-gradient(#34479a,#34479a)}
.bar i{background:var(--grad)}
.lb.tp{color:#ffc58f}
input[type=range]{accent-color:#7d8cff}
.row button,#prev{border-radius:999px;background:rgba(91,156,255,.08);border:1px solid rgba(91,156,255,.35)}
.formula,.side .formula{font-size:13px;line-height:1.5;color:#b4bde0}
.row button[aria-pressed=true]{border-color:rgba(91,156,255,.8);color:#dbe4ff;background:rgba(91,156,255,.18)}
.task .tick{border-color:#8a9bff}
.meter{border-color:rgba(140,160,255,.25);box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(140,160,255,.12)}
.back{display:inline-block;color:var(--mute);text-decoration:none;font-size:14px;font-weight:600;margin:0 0 10px}.lvl-done{display:block;text-align:center;background:#15281d;border:1px solid #2c5a3d;color:#9ff0c0;border-radius:12px;padding:12px;font-weight:700;text-decoration:none;margin:0 0 14px}.lvl-done[hidden]{display:none}</style>

<body>
<div class="app">
  <section class="stage" id="stage">
    <canvas id="gl" aria-label="3D model of the lesson"></canvas>
    <div class="labels" id="labels"></div>
    <section class="hud" id="hud" data-grp aria-live="polite">
      <div class="num u" data-ui="tnU"><span>Voltage</span><b id="wU"></b></div>
      <div class="num i" data-ui="tnI"><span>Current</span><b id="wI"></b></div>
      <div class="num r" data-ui="tnR"><span>Resistance</span><b id="wR"></b></div>
      <div class="num p" data-ui="tnP"><span>Power</span><b id="wP"></b></div>
      <p class="formula" data-ui="tfI" id="wF"></p>
      <div class="num i" data-ui="bNums"><span>Loop current</span><b id="nI"></b></div>
      <div class="num u" data-ui="bNums"><span>Drop across resistor</span><b id="nUR"></b></div>
      <div class="num u" data-ui="bNums"><span>Drop across LED</span><b id="nUL"></b></div>
      <div class="num p" data-ui="bNums"><span>Resistor heat</span><b id="nP"></b></div>
      <p class="st" data-ui="bNums"><span id="sLed" class="pill"></span><span id="sRes" class="pill"></span></p>
      <p class="formula" data-ui="bF" id="formula"></p>
    </section>
    <div class="tools" id="tools"><button id="reset" class="reset">Reset view</button><span class="hint">Drag to rotate · scroll or pinch to zoom</span></div>
    <aside class="info" id="info" hidden>
      <button class="x" id="infoX" aria-label="Close">×</button>
      <b id="infoT"></b><p id="infoP"></p>
    </aside>
    <div class="meter" id="meter" data-ui="meter" aria-live="polite">
      <div class="mtop"><span>Multimeter</span><span>V⎓</span></div>
      <div class="lcd" id="lcd">12.00<small>V</small></div>
      <div class="probes">
        <span class="pr"><i style="background:#e8332a"></i><b id="pRed">TP1</b></span>
        <span class="pr"><i style="background:#1a1a1a"></i><b id="pBlk">TP4</b></span>

{sc:'w',part:'Basics',t:'Voltage is height',s:"<b>Voltage</b> is how much “higher” one point is than another, in volts (V). A pump lifts water; a power supply lifts charges. The height is there even when the water stands still.",bt:["-", "Like plumbing", "Height above what?", "Voltage without current"],ui:['tU','tnU'],
 b:'<p><b>Voltage</b> is the difference in “height” between two points. The unit is the <b>volt (V)</b>.</p><p>Picture a water loop: the pump lifts water from the lower pipe to the upper one. The higher it lifts, the harder the water pushes on the way down. A power supply does the same with electric charges: a 12 V supply lifts them to a “height” of 12 V. The red bracket on the left shows that height.</p><p>Height is always measured <b>from something</b>. “It’s 12 volts here” means “12 volts above ground”. Ground (GND) is the lower pipe, the source minus: 0 V.</p><p>The valve at the top is closed: the water stands still, but the height is still there. <b>Voltage can exist without current.</b></p>',
 task:'Move the pump and watch the height change',ok:()=>S.tMoved},
{sc:'w',part:'Basics',t:'Current is flow',s:"<b>Current</b> is how much water passes through a cross-section of pipe per second, in amps (A). In a closed loop it’s the same everywhere.",bt:["Units", "Same all around the loop", "Which way it flows"],ui:['tU','tnU','tnI'],
 b:'<p><b>Current</b> is how much charge passes through a cross-section of pipe per second. The unit is the <b>amp (A)</b>. 1 A is roughly 6×10¹⁸ electrons per second, so electronics usually works in milliamps: 1 mA = 0.001 A.</p><p>The valve is open and water flows around the loop. Look at the two blue counter rings on different pipes: they show the same number. In one closed loop <b>the current is the same everywhere</b> : whatever flows in, flows out.</p><p class="note">Direction: by convention, current flows from plus to minus. Real electrons in copper crawl the other way; the convention was set before the electron was discovered. It doesn’t affect any calculation, and every schematic uses the conventional direction.</p>',
 task:'Set the pump to 0 V and the flow stops',ok:()=>S.valve&&S.tU===0},
{sc:'w',part:'Basics',t:'Resistance is a narrow pipe',s:"<b>Resistance</b> is how narrow the pipe is, in ohms (Ω). Ohm’s law ties it all together: <b>I = U / R</b>.",bt:["Narrow section", "Ohm’s law", "Rearranging the formula", "Where the height is lost"],ui:['tU','tR','tnU','tnI','tnR','tfI'],
 b:'<p><b>Resistance</b> is how much a part resists current. The unit is the <b>ohm (Ω)</b>. In plumbing it’s a narrow section: the narrower it is, the less water gets through at the same height.</p><p>All three quantities are tied together by <b>Ohm’s law: I = U / R</b>. Current (A) = voltage (V) / resistance (Ω). Raise the pump and current goes up. Narrow the pipe and current drops.</p><p>From the same formula: <b>R = U / I</b> and <b>U = I × R</b>. Check yourself with units, like types in code: volts / ohms = amps, volts / amps = ohms.</p><p>And notice: all the height is lost in the narrow section. Wide pipes barely resist, so the height doesn’t drop along them.</p>',
 task:'Get a current of 10 mA by adjusting the pump and the resistance',ok:()=>{const w=water();return Math.abs(w.I-0.01)<0.001}},
{sc:'w',part:'Basics',t:'Power is work and heat',s:"<b>Power</b> is how much energy per second turns into heat or work, in watts (W): <b>P = U × I</b>. The narrow section heats up.",bt:["What it is", "Formula", "Why the resistor heats up"],ui:['tU','tR','tnU','tnI','tnR','tnP','tfI'],
 b:'<p><b>Power</b> is how much energy per second turns into work, light or heat. The unit is the <b>watt (W)</b>. In plumbing, both the height the water falls from and how much of it flows matter: a tall waterfall with a thin stream and a low one with a wide flow can turn a mill equally well.</p><p><b>P = U × I</b> : power = voltage × current.</p><p>Plug Ohm’s law in and you get <b>P = I × I × R</b>. A narrow section carrying noticeable current heats up. A small resistor handles only 0.25 W.</p>',
 task:'Find a setting where the narrow section overheats (more than 0.25 W)',ok:()=>water().P>P_RATED},
{sc:'w',part:'Basics',t:'Units and prefixes',s:"Prefixes go in steps of 1000: <b>m</b> is a thousandth, <b>k</b> is a thousand. On schematics the letter replaces the decimal point: <b>4k7</b> = 4.7 kΩ.",bt:["Cheat sheet", "Prefixes", "How schematics write it", "In everyday life"],ui:['tU','tR','tnU','tnI','tnR','tnP','tfI'],
 b:'<table><tr><th>Quantity</th><th>Symbol</th><th>Unit</th><th>Water</th></tr><tr><td>Voltage</td><td>U (or V)</td><td>volt, V</td><td>height</td></tr><tr><td>Current</td><td>I</td><td>amp, A</td><td>flow</td></tr><tr><td>Resistance</td><td>R</td><td>ohm, Ω</td><td>narrowness</td></tr><tr><td>Power</td><td>P</td><td>watt, W</td><td>strength of the flow</td></tr></table><p>Prefixes in steps of 1000: <b>m</b> (milli) is a thousandth, <b>µ</b> is a millionth, <b>k</b> is a thousand, <b>M</b> is a million. 10 mA = 0.01 A, 4.7 kΩ = 4700 Ω.</p><p>Schematics write values with a letter in place of the decimal point, so the dot can’t get lost in print: <b>4k7</b> = 4.7 kΩ, <b>2R2</b> = 2.2 Ω.</p><p class="note">In everyday life: a “5V ⎓ 3A” charger gives 5 V × 3 A = 15 W.</p><div class="quiz"><input id="q1a" inputmode="decimal" placeholder="How many ohms is 4k7?" aria-label="How many ohms is 4k7"><button id="q1b">Check</button></div><p class="fb" id="q1f"></p>',
 task:'Answer how many ohms 4k7 is',ok:()=>S.q1},
{sc:'b',part:'Building the board',t:'Connecting the LED directly',s:"Swapping water for copper: pump → 12 V supply, pipes → traces. We connect an LED straight to the supply.",bt:["Water → copper", "The LED as a step", "-"],ui:['bPower','bNums'],build:{R:false,sw:false,tp:false},map:false,
 enter:()=>{S.powered=false;S.ledDead=false;S.resDead=false;S.V=12;S.closed=true;S.swap=false},
 b:'<p>Moving from water to copper. The pump is the <b>power supply</b> (a 12 V supply), the wide pipes are <b>copper traces</b> on the board.</p><p>We connect an <b>LED</b>to the source. In plumbing it’s like a step: while the “height” is below ~1.9 V no current flows through it, and above that it opens wide.</p><p>Power it on and see what happens.</p>',
 after:'<p><b>Why it burned.</b> Only the circuit’s resistance limits current, and copper plus an open LED have almost none. By Ohm’s law I = U / R: if R is close to zero, the current is huge, around an amp, while the LED’s limit is 0.05 A. The chip overheated in milliseconds.</p><p>We need a part that resists current: a narrow section of pipe.</p>',
 task:'Press “Power on”',ok:()=>S.ledDead},
{sc:'b',part:'Building the board',t:'Adding a resistor',s:"We add a 1 kΩ resistor, our narrow section. Current drops to ~10 mA and the LED survives.",bt:["-", "Calculating the current", "The price is heat", "-"],ui:['bNums','bF'],build:{R:true,sw:false,tp:false},map:false,
 enter:()=>{S.powered=true;S.ledDead=false;S.resDead=false;S.ri=9;S.V=12},
 b:'<p>We add a <b>resistor</b> of 1 kΩ, our narrow section. The LED is a fresh one in place of the burnt one.</p><p>The LED takes its ~1.9 V, and the remaining 10.1 V drops across the resistor. Current by Ohm’s law: 10.1 V / 1000 Ω ≈ <b>10 mA</b> , five times below the limit, so the LED glows happily.</p><p>The resistor pays for this with heat: P = 10.1 V × 0.01 A ≈ 0.1 W, with 0.25 W allowed.</p><p>Click the resistor and the LED to see what they are.</p>',
 task:'Click the resistor and the LED',ok:()=>S.seen.has('res')&&S.seen.has('led')},
{sc:'b',part:'Building the board',t:'Adding a switch',s:"A switch is a valve in the loop. Open it and current stops everywhere in the loop at once.",bt:["-", "The lights are current", "Real electrons", "Why the light comes on instantly"],ui:['bSw','bEl','bNums','bF'],build:{R:true,sw:true,tp:false},map:false,enter:()=>{S.powered=true},
 b:'<p>To turn the light on without pulling wires, we put a <b>switch</b> in the loop: a valve on the pipe.</p><p>The lights on the traces are current. In one loop it’s the same everywhere, so the lights run at the same speed around the whole circuit. Open the switch and current stops everywhere at once.</p><p>The lights run from plus to minus: that’s the conventional current direction. The “Show electrons” button adds blue dots: the real electrons, crawling the other way.</p><p class="note">Real electrons actually crawl very slowly, fractions of a millimetre per second. The light comes on instantly because the “push” travels down the wire at nearly the speed of light and shifts all the charges at once, like in a pipe completely full of water.</p>',
 task:'Flip the switch and turn on “Show electrons”',ok:()=>S.swT&&S.el},
{sc:'b',part:'Building the board',t:'Test points and the multimeter',s:"A multimeter measures the <b>difference</b> between the red and black probes. Click a TP: first click places the red probe, second the black.",bt:["Test points", "At a point vs across a part", "How to measure", "Kirchhoff’s law"],ui:['meter','bMap','bSw','bNums'],build:ALL,map:true,enter:()=>{S.closed=true;S.red='TP1';S.black='TP4';S.next='red'},
 b:'<p>We added yellow <b>test points</b> TP1–TP4, where you touch the multimeter probes. The red-blue fence above the traces is a height map, like in the water model.</p><ul><li><b>Voltage at a point</b> is its height relative to ground. It’s labelled at each TP.</li><li><b>Drop across a part</b> is the difference between its two legs: how much the height fell as current passed through it. The numbers in the corner of the scene show it.</li></ul><p>A multimeter measures the difference between the red and black probes. The first click on a TP places the red probe, the second the black.</p><p><b>Kirchhoff’s law:</b> the drops around a loop add up to the source voltage. The source lifted by 12 V, so together the parts must bring it down by 12.</p>',
 after:'<p>10.1 + 1.9 = 12. It adds up. Open the switch and measure TP1–TP2: current disappears and all 12 V end up across the gap.</p>',
 task:'Measure the drop across the resistor (TP2–TP3) and across the LED (TP3–TP4)',ok:()=>S.meas.has('TP2-TP3')&&S.meas.has('TP3-TP4')},
{sc:'b',part:'Building the board',t:'The LED holds its own voltage',s:"The LED always takes ~1.9 V and the resistor gets the rest. The order of parts in the loop doesn’t matter.",bt:["Trap", "Why 1.9 V", "The box picture", "“Before” and “after”"],ui:['meter','bMap','bSwap','bNums'],build:ALL,map:true,enter:()=>{S.closed=true},
 b:'<p>A common trap: thinking the resistor comes “first”, spends its share, and the LED gets what’s left. Voltage isn’t used up along the way like fuel. All the heights settle at once, across the whole circuit.</p><p>When current flows through an LED, its legs always differ by about 1.9 V. The lower leg is at ground (0 V), so the upper one is at 1.9 V. The resistor gets the rest: 12 − 1.9 = 10.1 V. This doesn’t depend on resistance; only the current does.</p><p>A box 1.9 m tall stands on the floor (the LED), and a rubber band stretches 12 m from the ceiling to its lid (the resistor). The lid is at 1.9 m because of the box, not the band.</p><p class="note">And “before” and “after” is just a convention: for electrons running from minus, the LED actually comes first.</p>',
 after:'<p>The drops are the same: 10.1 V across the resistor and 1.9 V across the LED. Only the height of the middle point TP3 changed. The order of parts in one loop changes nothing.</p>',
 task:'Swap the parts and compare the drops',ok:()=>S.swap},
{sc:'b',part:'Building the board',t:'Choosing a resistor',s:"Recipe: <b>R = (supply − 1.9 V) / desired current</b>, then the nearest standard value.",bt:["Recipe", "Example", "In real life"],ui:['bR','bMap','bNums','bF'],build:ALL,map:false,enter:()=>{S.ri=12;S.V=12;S.closed=true},
 b:'<p>Right now it’s 10 kΩ and the LED barely glows. The recipe everyone uses:</p><ol><li>Decide how much current the LED needs (usually 5–15 mA).</li><li>Voltage across the resistor: supply minus 1.9 V.</li><li><b>R = U / I.</b></li><li>Pick the nearest standard value.</li></ol><p>Example: from an ESP32 (3.3 V) we want 10 mA → (3.3 − 1.9) / 0.01 = 140 Ω → use 150.</p><p>In real circuits you usually don’t tweak the voltage; it’s set by the supply rail (12, 5 or 3.3 V). You tweak the resistor.</p>',
 task:'At 12 V, pick a resistor for about 10 mA',ok:c=>Math.abs(S.V-12)<0.05&&S.closed&&!c.gap&&Math.abs(c.I-0.01)<0.0015},
{sc:'b',part:'Building the board',t:'What burns first',s:"There’s one current in the loop but different limits: the LED fears <b>current</b>, the resistor fears <b>heat</b>.",bt:["One current for all", "Part limits", "Not obvious", "Where the energy goes"],ui:['bV','bR','bMap','bNums','bF'],build:ALL,map:false,enter:()=>{S.closed=true},
 b:'<p>The parts in one loop carry the same current. There’s no such thing as overloading “the circuit in general”: each part has its own limit, and the one whose limit is exceeded first dies.</p><ul><li><b>LED</b> is limited by <b>current</b>: 20–25 mA long term, around 50 mA max. The chip is smaller than a millimetre and overheats in milliseconds.</li><li><b>Resistor</b> is limited by <b>heat</b>: P = I × I × R, a small one handles 0.25 W. It’s bulkier, so it heats up and smokes for a while first.</li></ul><p>At 0 Ω the resistor doesn’t heat at all (I × I × 0 = 0), and all that huge current goes through the LED. That’s why without a resistor it’s the LED that burns. At 220–470 Ω the resistor starts suffering first.</p><p>The LED consumes power too: 1.9 V × I. The corner of the scene shows that resistor heat plus LED power equals exactly what the source delivered.</p>',
 task:'Overheat the resistor or burn the LED',ok:c=>c.P>P_RATED||S.ledDead||S.resDead},
{sc:'b',part:'Building the board',t:'Your turn',s:"An LED from USB (5 V) needs 15 mA. How many ohms?",bt:["-", "Hint"],ui:['bV','bR','bNums','bF'],build:ALL,map:false,
 b:'<p>A real-life problem: an LED powered from USB (5 V), and we want 15 mA. How many ohms do we need?</p><p class="note">From I = U / R it follows that <b>R = U / I</b>. First find the voltage across the resistor (5 V minus 1.9 V), then divide it by the current in amps.</p><div class="quiz"><input id="qa" inputmode="decimal" placeholder="Answer in ohms" aria-label="Answer in ohms"><button id="qb">Check</button></div><p class="fb" id="qf"></p>',
