<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A free interactive 3D course: from Ohm’s law to the power board of a robot arm. Learn by breaking things on a virtual bench.">
<meta property="og:title" content="Electronics for a robot arm">
<meta property="og:description" content="A free interactive 3D course: from Ohm’s law to the power board of a robot arm.">
<meta property="og:image" content="https://kureev.com/og-electronics.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Level 1: Power input</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning, a workbench lesson for a software engineer
   IDEA the power input of his own robot-arm board, built part by part, each part added after something burns
   PICTURE live 3D board: 12 V supply, fuse, protection, servo bus, power LED, divider into a 0–3 V meter; water front view for the check valve and the divider
   COLOUR night bench #050817, solder-mask green, copper, water blue, red for + and danger
   TYPE Manrope 800 + Manrope
   LAYOUT laptop: 3D stage left, lesson column 410px right; phone: stage on top, lesson below; only the controls a step needs are shown */
:root{color-scheme:dark;--bg:#050817;--panel:#0a1230;--card:#0e1840;--line:#1e2a5c;--ink:#eef1ff;--mute:#8f9bc4;--cu:#e39a52;--hot:#ff5a3c;--ok:#5fd38d;--warn:#ffc14d}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%}
.stage{position:relative;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;font:600 13px/1.2 Manrope,sans-serif;padding:3px 8px;border-radius:6px;background:rgba(5,8,23,.82);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.lb.big{font-size:15px;color:#ffd1c4;border-color:#6b2a1c}
.lb.flow{color:#bfe3ff;border-color:#24496b}
.lb.lvl{background:none;border:0;color:var(--mute);font-size:12px;padding:0}
.lb.bad{color:#ffb39f;border-color:#6b2a1c}
.lb.good{color:#9ff0c0;border-color:#2f4a9e}
.lb.dim{color:var(--mute);border-style:dashed;font-weight:400}
.tools{position:absolute;left:16px;top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.reset{min-height:36px;font-size:14px;background:rgba(14,22,60,.9)}
.hint{font-size:13px;color:var(--mute);background:rgba(5,8,23,.7);padding:4px 10px;border-radius:8px}
.info{position:absolute;right:16px;top:14px;width:min(300px,calc(100% - 32px));background:rgba(14,22,60,.96);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.info b{display:block;font-size:15px;margin:0 28px 4px 0}
.info p{margin:0;color:#c9d2f5}
.x{position:absolute;right:6px;top:4px;width:32px;height:32px;min-height:0;padding:0;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;border-radius:8px}
.panel{overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);padding:22px 20px 28px}
h1{font:800 31px/1.06 Manrope,sans-serif;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.sub{margin:0 0 16px;color:var(--mute);font-size:15px}
.card,.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.stephead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mute);font-size:13px;font-weight:600;flex-wrap:wrap}
.part{color:var(--cu)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:13px;height:13px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer}
.dots button.on{background:var(--ink);border-color:var(--ink)}
.dots button.done{border-color:var(--ok)}
.dots button.on.done{background:var(--ok)}
h2{font:800 22px/1.15 Manrope,sans-serif;margin:8px 0 8px;letter-spacing:-.01em}
.stepb p,.stepb ol,.stepb ul{margin:0 0 10px}
.stepb ol,.stepb ul{padding-left:20px}
.stepb li{margin-bottom:4px}
.stepb .note{font-size:14px;color:var(--mute)}
.stepb b{color:#fff}
.after{border-left:3px solid var(--ok);padding:2px 0 2px 12px;margin:0 0 10px}
.after p{margin:0 0 8px}
.task{border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;background:#151d45;border:1px solid #2e3a78;color:var(--warn)}
.task.ok{color:var(--ok);border-color:#2f4a9e;background:#0f1d4a}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
button{font:600 15px Manrope,sans-serif;color:var(--ink);background:#141f4d;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
button:hover{border-color:#33407a}
button:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
button.pri{background:var(--ink);color:#050817;border-color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
.ctl label{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px;margin-top:4px}
output{color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--cu);cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row>*{flex:1 1 140px}
.row button[aria-pressed=true]{border-color:var(--ok);color:var(--ok)}
.danger{background:#3a1b14;border-color:#a33d22;color:#ffd1c4}
.fix{width:100%;margin-top:4px;background:#3a1b14;border-color:#6b2a1c;color:#ffb39f}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.num span{display:block;font-size:13px;color:var(--mute)}
.num b{font:800 22px/1.2 Manrope,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.num.u b{color:#ff8a70}.num.i b{color:#8fd0ff}.num.p b{color:#ff6a4d}.num.g b{color:#9ff0c0}
.st{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 0}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.g{color:var(--ok);border-color:#2f4a9e}.pill.y{color:var(--warn);border-color:#5a4a1f}.pill.r{color:#ff8a70;border-color:#6b2a1c}.pill.m{color:var(--mute)}
.formula{grid-column:1/-1;margin:0;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.6;color:#c9d2f5}
.hw{list-style:none;padding:0!important;margin:0 0 10px}
.hw li{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:14px}
.hw input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.err{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);padding:20px;text-align:center}
@media(max-width:900px){
html,body{height:auto}
.app{grid-template-columns:minmax(0,1fr);height:auto}
.stage{height:62svh;min-height:360px}
.panel{border-left:0;border-top:1px solid var(--line);padding:18px 16px 28px}
.hint{display:none}
.info{right:10px;top:10px}
.lb{font-size:11px;padding:2px 5px}
.lb.part{display:none!important}
}

.lead{font-size:16px;line-height:1.5;margin:0 0 12px}.lead b{color:#fff}
.step .card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 0 4px;margin:0 0 10px}
.step .after{margin:10px 0 0}
.stepx:empty{display:none}.stepx{margin-top:12px}.stepx p{margin:0 0 10px}
.stepx table{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 10px}
.more{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.more summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:40px;font-weight:700;font-size:15px;color:var(--mute)}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.more[open] summary::before{transform:rotate(45deg)}
.more summary:hover{color:var(--ink)}
.blocks{display:grid;gap:8px;margin-top:4px}
.blk{background:#131c46;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.blk h3{margin:0 0 4px;font:800 12px/1.3 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--cu)}
.blk p,.blk ul,.blk ol{margin:0 0 6px}.blk>:last-child{margin-bottom:0}
.blk ul,.blk ol{padding-left:20px}
.blk b{color:#fff}
.blk.note{background:none;border-style:dashed;color:var(--mute);font-size:14px}
.blk.note h3{color:var(--mute)}
.blk table{width:100%;border-collapse:collapse;font-size:14px}
.blk th{text-align:left;color:var(--mute);font-weight:600;font-size:13px;border-bottom:1px solid var(--line);padding:4px 6px 4px 0}
.blk td{border-bottom:1px solid var(--line);padding:5px 6px 5px 0;vertical-align:top}
.hud{position:absolute;right:12px;bottom:12px;display:flex;flex-flow:row wrap;justify-content:flex-end;align-content:flex-end;gap:6px;max-width:min(460px,calc(100% - 24px));pointer-events:none;background:none;border:0;padding:0;margin:0}
.hud .num{display:flex;align-items:baseline;gap:10px;background:rgba(5,8,23,.86);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.hud .num span{display:inline;font-size:12px}
.hud .num b{font-size:18px}
.hud .st{margin:0;justify-content:flex-end;flex:1 0 100%}.hud .pill{background:rgba(5,8,23,.86)}
.hud .formula{border:1px solid var(--line);border-radius:10px;background:rgba(5,8,23,.86);padding:7px 10px;font-size:13px;line-height:1.5;text-align:right}
.hud .formula:empty{display:none}
@media(max-width:900px){.hud{right:8px;bottom:8px;gap:4px;max-width:calc(100% - 16px)}.hud .num{padding:2px 8px}.hud .num span{font-size:11px}.hud .num b{font-size:15px}.hud .formula{font-size:11px;padding:5px 8px;max-width:100%}}

/* panel v2: one header line, segmented progress, goal row, sticky footer */
.app{grid-template-columns:minmax(0,1fr) 384px}
.panel{display:flex;flex-direction:column;padding:0}
.ph{display:flex;align-items:baseline;gap:10px;padding:16px 20px 0;font-size:13px;color:var(--mute);flex-wrap:wrap}
.ph .ltitle{color:var(--ink);font-weight:700;font-size:14px}
.ph .back{margin:0;font-size:13px}
.step{background:none;border:0;border-radius:0;padding:14px 20px 10px;margin:0;flex:1 0 auto}
.prog{margin:0 0 2px}
.ptop{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.ptop .part{color:var(--cu)}
#stepC{font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;flex-wrap:nowrap}
.dots button{flex:1 1 0;height:16px;min-height:0;padding:0;border:0;border-radius:0;cursor:pointer;background:linear-gradient(var(--line),var(--line)) center/100% 5px no-repeat}
.dots button.pb{margin-left:7px}
.dots button.done{background-image:linear-gradient(#3b5bd9,#3b5bd9)}
.dots button.on{background-image:linear-gradient(var(--ink),var(--ink));background-size:100% 7px}
.dots button.on.done{background-image:linear-gradient(var(--ok),var(--ok))}
.dots button:hover{background-size:100% 7px}
h2{font-size:23px;margin:10px 0 6px}
.lead{margin:0 0 6px}
.step .card{border-top:0;padding:6px 0 0;margin:0 0 6px}
.task{display:flex;gap:10px;align-items:flex-start;background:#121b48;border:1px solid #2e3a78;border-radius:12px;padding:10px 12px;color:var(--ink);font-size:15px;font-weight:600;line-height:1.4}
.task .tick{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--warn);margin-top:0;position:relative}
.task.ok{background:#0d1a45;border-color:#2f4a9e;color:#dbe2ff}
.task.ok .tick{background:var(--ok);border-color:var(--ok)}
.task.ok .tick::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #050817;border-width:0 2px 2px 0;transform:rotate(45deg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.more summary .cnt{font-weight:600;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:2px}
.nav{position:sticky;bottom:0;z-index:3;margin:0;padding:12px 20px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px}
.nav #prev{flex:none;width:48px;padding:0;font-size:22px;line-height:1}
.nav #next{flex:1}
.lvl-done{margin:0 20px 12px!important}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.ph{padding:14px 16px 0}.step{padding:12px 16px 8px}.nav{padding:10px 16px calc(10px + env(safe-area-inset-bottom))}}
/* polish v2 */
.lb{font-weight:500;font-size:12px;line-height:16px;padding:2px 7px;color:#dfe4fb;background:rgba(6,10,30,.86);border-color:rgba(255,255,255,.08)}
.lb.tp{color:#e3b27a;border-color:rgba(255,255,255,.08)}
.lb.big{font-size:13px;border-color:rgba(255,120,90,.35)}
.lb.flow{border-color:rgba(120,180,255,.25)}
.lb.bad{border-color:rgba(255,120,90,.35)}.lb.good{border-color:rgba(95,211,141,.3)}
.meter{background:#0b1333;color:#dfe4fb;border:1px solid #6b4a2a;width:208px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.lcd{background:#c7d1b0;font-size:30px}.next{color:#8f9bc4}
.reset{min-height:32px;font-size:13px;padding:4px 12px;background:rgba(10,16,44,.8)}
.hint{transition:opacity .6s}.stage.touched .hint{opacity:0;pointer-events:none}
.row button[aria-pressed=true]{background:rgba(95,211,141,.1)}
.dots button,.dots button:hover,.dots button.on{background-size:100% 4px}
.dots button.done{background-image:linear-gradient(#34479a,#34479a)}
.dots button.on,.dots button.on.done{background-image:linear-gradient(var(--ok),var(--ok))}
.side{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.side:empty{display:none}
.side .formula{margin:0;padding:0;border:0;background:none;font-size:13px;line-height:18px;color:#a3acd0;text-align:left;font-variant-numeric:tabular-nums}
.side .formula:empty{display:none}
.side .st{margin:0;justify-content:flex-start}
@media(max-width:900px){
 .stage{height:46svh;min-height:300px}
 .meter{left:auto;right:8px;top:8px;bottom:auto;width:150px;padding:7px 9px 8px}
 .meter .lcd{font-size:20px;margin:4px 0 5px}.meter .next{display:none}
 .hud .num:nth-child(n+3){display:none}
}
/* brand v1 */
:root{--blue:#5b9cff;--violet:#8a6bff;--grad:linear-gradient(100deg,#5b9cff,#8a6bff 60%,#c77dff);--ok:#59f3a8;--warn:#ffb26b}
body{background:radial-gradient(60% 50% at 20% 0%,rgba(40,70,190,.18),transparent 70%),var(--bg)}
.panel{background:linear-gradient(180deg,#0a1230,#070c24 60%)}
h1,h2,.ltitle{font-family:Unbounded,Manrope,sans-serif;font-weight:600;letter-spacing:-.02em}
h2#stepT{font-size:clamp(19px,1.7vw,23px);line-height:1.2}
button.pri,a.go{background:#E8ECFF;color:#0A0F2E;border-color:#E8ECFF;border-radius:999px}
button.pri:hover,a.go:hover{background:#fff}
a.go.ghost{background:rgba(140,160,255,.08);color:var(--ink);border-color:rgba(140,160,255,.25)}
.dots button.on,.dots button.on.done{background-image:var(--grad)}
.dots button.done{background-image:linear-gradient(#34479a,#34479a)}
.bar i{background:var(--grad)}
.lb.tp{color:#ffc58f}
input[type=range]{accent-color:#7d8cff}
.row button,#prev{border-radius:999px;background:rgba(91,156,255,.08);border:1px solid rgba(91,156,255,.35)}
.formula,.side .formula{font-size:13px;line-height:1.5;color:#b4bde0}
.row button[aria-pressed=true]{border-color:rgba(91,156,255,.8);color:#dbe4ff;background:rgba(91,156,255,.18)}
.task .tick{border-color:#8a9bff}
.meter{border-color:rgba(140,160,255,.25);box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(140,160,255,.12)}
.back{display:inline-block;color:var(--mute);text-decoration:none;font-size:14px;font-weight:600;margin:0 0 10px}.lvl-done{display:block;text-align:center;background:#15281d;border:1px solid #2c5a3d;color:#9ff0c0;border-radius:12px;padding:12px;font-weight:700;text-decoration:none;margin:0 0 14px}.lvl-done[hidden]{display:none}</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <canvas id="gl" aria-label="3D model of the lesson"></canvas>
    <div class="labels" id="labels"></div>
    <section class="hud" id="hud" data-grp aria-live="polite">
      <div class="num u" data-ui="wnU"><span>Pump</span><b id="wnU"></b></div>
      <div class="num i" data-ui="wnI"><span>Flow (current)</span><b id="wnI"></b></div>
      <div class="num p" data-ui="wnD"><span>Drop across the valve</span><b id="wnD"></b></div>
      <div class="num g" data-ui="wnOut"><span>Divider output</span><b id="wnOut"></b></div>
      <p class="formula" data-ui="wF" id="wF"></p>
      <div class="num i" data-ui="nI"><span>Supply current</span><b id="nI"></b></div>
      <div class="num u" data-ui="nV"><span>Rail voltage</span><b id="nV"></b></div>
      <div class="num p" data-ui="nP"><span>Heat in the protection</span><b id="nP"></b></div>
      <div class="num g" data-ui="nTap"><span>At the meter</span><b id="nTap"></b></div>
      <p class="st" data-ui="pills" id="pills"></p>
      <p class="formula" data-ui="bF" id="formula"></p>
    </section>
    <div class="tools" id="tools"><button id="reset" class="reset">Reset view</button><span class="hint">Drag to rotate · scroll or pinch to zoom · click a part to see what it is</span></div>
    <aside class="info" id="info" hidden>
      <button class="x" id="infoX" aria-label="Close">×</button>
      <b id="infoT"></b><p id="infoP"></p>
    </aside>
  </section>
  <main class="panel">
    <header class="ph"><a class="back" href="/electronics">← Map</a><span class="lesson">Lesson 1</span><span class="ltitle">Power input</span></header>
    <article class="step">
      <div class="prog"><div class="ptop"><span id="stepN"></span><span id="stepC"></span></div><div class="dots" id="dots" role="group" aria-label="Steps"></div></div>
      <h2 id="stepT"></h2>
      <div class="lead" id="stepS"></div>
      <section class="card ctl" data-grp>
        <div data-ui="wU"><label for="wu">Pump <output id="wuO"></output></label><input type="range" id="wu" min="0" max="12" step="0.05" value="12"></div>
        <div data-ui="wR1"><label for="w1">Upper narrow section, R1 <output id="w1O"></output></label><input type="range" id="w1" min="0" max="6" step="1" value="3"></div>
        <div data-ui="wR2"><label for="w2">Lower narrow section, R2 <output id="w2O"></output></label><input type="range" id="w2" min="0" max="6" step="1" value="3"></div>
        <div class="row"><button id="wrev" data-ui="wRev" aria-pressed="false">Reverse the pump</button><button id="wtype" data-ui="wType" aria-pressed="false">0.7 V diode</button><button id="don" data-ui="dOn" aria-pressed="true">Disconnect R2</button></div>
        <div data-ui="vin"><label for="vin">Supply voltage <output id="vinO"></output></label><input type="range" id="vin" min="9" max="12.6" step="0.1" value="12"></div>
        <div data-ui="k"><label for="k">Servos stalled <output id="kO"></output></label><input type="range" id="k" min="0" max="6" step="1" value="0"></div>
        <div data-ui="fuse"><label for="fu">Fuse (change it and a new one goes in) <output id="fuO"></output></label><input type="range" id="fu" min="0" max="6" step="1" value="4"></div>
        <div data-ui="ledR"><label for="lr">Indicator resistor <output id="lrO"></output></label><input type="range" id="lr" min="0" max="5" step="1" value="0"></div>

STEPS=[
{sc:'b',part:'Power',t:'Connecting the power supply',s:"A <b>12V ⎓ 10A</b> supply holds 12 V and delivers <b>up to</b> 10 A. Servos hang on the rail in parallel, so their currents add up.",bt:["What we’re building", "What the label means", "In parallel"],ui:['k','nI','nV','pills'],build:B(false,'none',false,false),enter:()=>{repair();S.rev=false;S.k=0;S.vin=12},
 b:'<p>Today we build the input stage of the arm board: 12 V supply → connector → copper rail → six servos. We’ll connect the board’s brain (ESP32) later, once we understand the physics of all the basic pieces.</p><p>The supply says <b>12V ⎓ 10A</b>. That means it holds 12 V and can deliver <b>up to</b> 10 A. How much current actually flows is decided by the load, as in lesson 0.</p><p>The servos are connected to the rail <b>in parallel</b> , all to the same plus and minus. This is new: parts in parallel <b>share one voltage, and their currents add up</b>. A moving servo draws about 0.3 A, and when it stalls and pushes with all its might, about 2 A.</p>',
 after:'<p>0.3 × 4 + 2 × 2 = 5.2 A. Stall all six and the arm wants 12 A, while the supply can only do 10: it goes into protection and shuts off. You get a full reboot out of nowhere. Remember: size the power supply for the worst case.</p>',
 task:'Stall two servos and watch the current',ok:()=>S.k>=2},
{sc:'b',part:'Power',t:'A short circuit',s:"<b>A short circuit</b> is plus and minus connected directly. Hundreds of amps flow, and something will burn.",bt:["-", "Why hundreds of amps"],ui:['short','nI','nV','pills','bF'],build:B(false,'none',false,false),enter:()=>{repair();S.rev=false;S.k=1},
 b:'<p><b>A short circuit</b> is when plus connects to minus directly, with almost no resistance. A dropped screwdriver, a blob of solder, a frayed wire.</p><p>By Ohm’s law I = U / R: with hundredths of an ohm, the current comes out at hundreds of amps. And heat grows as I × I × R. Something in the circuit will burn, usually the thinnest spot.</p>',
 after:'<p><b>The narrowest trace burnt.</b> The supply gave everything it could for the milliseconds before its protection kicked in, and that was enough for the trace. A battery, like on a drone, has no protection at all and will deliver hundreds of amps until something catches fire.</p><p>We need a part that is deliberately the weakest point and dies first.</p>',
 task:'Drop a screwdriver on the board',ok:()=>S.traceBurnt},
{sc:'b',part:'Power',t:'Fuse',s:"<b>Fuse</b> is a deliberately weak point. Its rating is above the working current but below what would kill the board.",bt:["How it works", "Choosing the rating", "In reality"],ui:['k','fuse','short','nI','nV','pills','bF'],build:B(true,'none',false,false),enter:()=>{repair();S.rev=false;S.k=0;S.fi=1;S.fl.k2=S.fl.sh=false},
 b:'<p><b>Fuse</b> is a deliberately weakest point: a thin wire that melts if current exceeds the rating. It dies and the board survives. There are single-use ones (you put in a new one) and self-resetting ones (PTC): they heat up, open, and conduct again once cool.</p><ul><li><b>above</b> the largest normal current, otherwise it’ll blow during normal work;</li><li><b>below</b> what would kill the traces, wires and supply.</li></ul><p class="note">Real fuses don’t blow instantly: they survive the short current surge when a motor starts. Here it’s instant, for simplicity.</p>',
 after:'<p>The fuse blew instead of the trace. You replace it for pennies and the board is alive again. In normal operation it doesn’t get in the way: it drops a fraction of a volt.</p>',
 task:'Pick a rating: two stalled servos (5.2 A) keep working, but the screwdriver blows the fuse',ok:()=>S.fl.k2&&S.fl.sh},
{sc:'b',part:'Power',t:'Swapped wires',s:"Swap the wires and the rail gets −12 V. Almost all electronics die from that.",bt:["Polarity", "Why it dies", "Rule"],ui:['rev','nV','pills','bF'],build:B(true,'none',false,false),enter:()=>{repair();S.rev=false;S.k=0;S.fi=4},
 b:'<p><b>Polarity</b> is which side is plus and which is minus. Electronics is designed for one polarity. Swap the wires and the rail gets −12 V.</p><p>Inside almost every chip, tiny protection diodes run from each pin to the supply. With reversed polarity they all open at once, and current flows through the chip that it was never designed for.</p><p>Connectors that can be plugged in backwards will one day be plugged in backwards. Especially at 2 am.</p>',
 after:'<p>The servos burnt. The fuse didn’t help: the current wasn’t huge, just going the wrong way, and it never reached the rating. We need a part that lets current through in the right direction only.</p>',
 task:'Swap the wires',ok:()=>S.servosDead},
{sc:'v',part:'Protection',t:'The diode is a check valve',s:"<b>Diode</b> — a check valve: it passes current one way and takes ~0.45 V for itself.",bt:["Check valve", "Opening threshold", "The price: a drop and heat", "What it looks like in real life"],ui:['wU','wRev','wType','wnU','wnI','wnD','wF'],enter:()=>{S.wRev=false;S.wU=12;S.vSi=false;S.fl.below=false},
 b:'<p><b>Diode</b> passes current in one direction only. In plumbing it’s a <b>check valve</b>: a hinged flap. Flow in the right direction pushes it open and passes; flow backwards presses it against the seat, and that’s it.</p><p>The flap is held by a <b>spring</b>. To open it you need pressure above a threshold: about <b>0.45 V</b> for a Schottky diode and about <b>0.7 V</b> for a regular silicon one. While the pump is weaker, the valve stays shut and there’s no current, just like the LED in lesson 0 stayed dark below 1.9 V.</p><p>Even an open valve takes those 0.45 V from the flow: compare the gauges before and after. That’s why a diode heats up: P = 0.45 V × current.</p><p>In front lies a real diode: the stripe on the body is the cathode, and current flows towards it, like an arrow.</p>',
 after:'<p>The pump pushes backwards, so the flap is pressed against the seat and nothing flows. That’s exactly what we want from protection: swap the wires and current simply doesn’t flow.</p>',
 task:'Lower the pump below the threshold, then reverse it',ok:()=>S.fl.below&&S.wRev},
{sc:'b',part:'Protection',t:'Diode protection',s:"We put a Schottky diode in the plus line. Swap the wires and current is zero, the board survives. The price: 0.45 V and heat.",bt:["Where it goes", "What it gives us", "The downside"],ui:['rev','k','nI','nV','nP','pills','bF'],build:B(true,'diode',false,false),enter:()=>{repair();S.rev=false;S.k=0;S.fl.rv=S.fl.hot=false},
 b:'<p>We add a <b>Schottky diode</b> in series in the plus line, right after the fuse. The stripe on the body is the cathode, facing the rail.</p><p>Swap the wires and the diode is shut: zero current, the electronics survive.</p><p>But remember the step at the valve: a diode always drops ~0.45 V and heats up by 0.45 V × current. For an LED that’s nothing; for six servos, let’s see.</p>',
 after:'<p>At 5.2 A the diode dissipates 0.45 × 5.2 ≈ 2.3 W. That’s a lot for a small package without a heatsink: it gets scorching hot. Plus the servos get half a volt less. For small currents a diode is great protection; for motors, not so much.</p>',
 task:'Swap the wires, then put them back and stall two servos',ok:()=>S.fl.rv&&S.fl.hot},
{sc:'b',part:'Protection',t:'MOSFET instead of a diode',s:"<b>MOSFET</b> is a valve opened by voltage. Open, it’s almost a wire, so it barely heats up.",bt:["What it is", "The protection trick", "How hot it gets"],ui:['prot','rev','k','nI','nV','nP','pills','bF'],build:B(true,'fet',false,false),enter:()=>{repair();S.rev=false;S.k=2;S.fl.cd=S.fl.cf=false},
 b:'<p><b>MOSFET</b> (a field-effect transistor) is a valve opened by voltage. It has three legs: source, drain and <b>gate</b>. Apply the right voltage to the gate and the channel opens, becoming almost a wire: thousandths of an ohm. Remove it and the channel closes.</p><p>The protection trick: we tie the gate to ground (see the thin trace to GND). With correct polarity there are 12 V between gate and source, so the valve is open. With reversed polarity there’s no voltage, so it’s shut.</p><p>Heat is now calculated like a resistor’s: P = I × I × R = 5.2 × 5.2 × 0.008 ≈ 0.2 W. Ten times less than the diode.</p>',
 task:'Compare diode and MOSFET heating with two servos stalled',ok:()=>S.fl.cd&&S.fl.cf},
{sc:'b',part:'Extras',t:'Power indicator',s:"A green LED with a resistor: lit means the rail has power. 2–5 mA is enough.",bt:["Like in lesson 0", "-", "Calculating the resistor"],ui:['ledR','nI','nV','pills','bF'],build:B(true,'fet',true,false),enter:()=>{repair();S.rev=false;S.k=0;S.lri=0},
 b:'<p>Let’s add a green LED: lit means the rail has power. This is straight from lesson 0: an LED plus a resistor, just from 12 V. It’s connected to the rail in parallel with the servos, so it sees the same 12 V, and its current simply adds to the total.</p><p>2–5 mA is enough for an indicator: it should be visible, not blinding.</p><p class="note">Resistor: R = (12 − 1.9) / current. Right now it’s 220 Ω; see what that gives you.</p>',
 task:'Pick a resistor so 2–5 mA flows through the indicator',ok:c=>c.led>=0.002&&c.led<=0.005},
{sc:'d',part:'Divider',t:'Voltage divider',s:"Two resistors between plus and ground make a <b>divider</b>: <b>Uout = U × R2 / (R1 + R2)</b>.",bt:["Staircase", "Divider output", "The balls are current", "Without R2", "A classic example"],ui:['wU','wR1','wR2','dOn','wnU','wnI','wnOut','wF'],enter:()=>{S.wU=12;S.w1=3;S.w2=3;S.dOn=true;S.fl.off=false},
 b:'<p>Two resistors in series between plus and ground make a <b>voltage divider</b>. Picture a staircase from 12 V down to ground. The same current flows through both resistors, so every kilohm takes the same share, like equal steps. Orange steps are R1, teal ones are R2.</p><p>The green landing between them is the divider output, where the meter probe sits. Its height: <b>Uout = U × R2 / (R1 + R2)</b>.</p><p>The balls are current: the source lift raises them to 12 V, they roll down the stairs and come back around.</p><p>Disconnect R2: there’s nowhere left to go down, the balls stop, and the R1 staircase flattens: with no current, nothing drops across it. The landing ends up at the full 12 V.</p><p class="note">A classic example: 40 kΩ and 10 kΩ divide 5 V by five.</p>',
 task:'Disconnect R2 and look at the meter, then reconnect it and make the output ≈ 1/5 of the source',ok:()=>{const w=water();return S.fl.off&&S.dOn&&w.U>0&&Math.abs(w.out/w.U-0.2)<0.03}},
{sc:'b',part:'Divider',t:'Measuring the supply voltage',s:"The meter tolerates up to 3 V, but the rail goes up to 12.6 V. A divider brings it down to a safe 2–3 V.",bt:["The problem", "The solution", "How to choose", "Converting back", "Next"],ui:['vin','divR1','divR2','nV','nTap','pills','bF'],build:B(true,'fet',true,true),enter:()=>{repair();S.rev=false;S.k=0;S.lri=3;S.b1=6;S.b2=0;S.vin=12},
 b:'<p>We want to know how many volts the supply gives, for example to notice a battery running low. Let’s take a <b>0–3 V meter</b>: it’s like your multimeter, but with a 3 V limit and no protection. It has two legs: “+” and ground. Inside it has a huge resistance, so it draws almost no current and just looks at the voltage. Put 12 V on it and it burns.</p><p>The solution is a divider: R1 from the rail, R2 to ground, the meter at the point between them. Without R2 no current would flow through R1 (the meter draws almost none), nothing would drop across R1, and the meter would see the full 12 V.</p><ul><li>at the maximum voltage (12.6 V for a charged 3S battery) the meter sees <b>no more than 3 V</b>;</li><li>but not too little either, ideally above 2 V, or you lose precision;</li><li>resistors in the tens of kilohms: the divider constantly eats U / (R1 + R2), no point wasting it.</li></ul><p>You then convert back to the supply voltage: reading × (R1 + R2) / R2.</p><p class="note">When we build the board’s brain, an ESP32 input takes this meter’s place; it works exactly the same way.</p>',

    ctl.update();
    const I=Math.abs(C.I),sp=I>0?Math.min(14,0.6+2.2*Math.sqrt(I)):0;flow+=(S.rev?-1:1)*sp*dt*slow;
    for(let i=0;i<NP;i++){bAt(flow+i*BLT/NP,pv);dummy.position.set(pv.x,0.11,pv.z);dummy.updateMatrix();parts.setMatrixAt(i,dummy.matrix)}parts.instanceMatrix.needsUpdate=true;
    flashL.intensity=flashT*10;flashL.position.copy(flashAt).add(V3(0,0.6,0));flashT=Math.max(0,flashT-dt*1.4);sdMat.emissiveIntensity=S.short?1.2:0;
    const hot=[];if(S.prot!=='none'&&C.Pp>1.5)hot.push(V3(-1.6,0.4,-2));if(S.servosDead)hot.push(V3(6.7,0.6,0));if(S.traceBurnt)hot.push(V3(-2.6,0.2,-2));if(S.espDead)hot.push(V3(3.7,0.4,0));
    smokeT-=dt;if(hot.length&&smokeT<=0){smokeT=0.16;const s=smoke.find(o=>o.life<=0);if(s){s.life=1;s.m.position.copy(hot[Math.floor(Math.random()*hot.length)]).add(V3((Math.random()-.5)*0.4,0,(Math.random()-.5)*0.4))}}
    smoke.forEach(o=>{if(o.life>0){o.life-=dt*0.55;o.m.position.y+=dt*0.7;o.m.scale.setScalar(1+(1-o.life)*2.2);o.m.material.opacity=Math.max(0,o.life*0.45)}else o.m.material.opacity=0});
    gl.render(scB,cam);
  }
  const W=stage.clientWidth,H=stage.clientHeight,ac=cam;
  labels.forEach(L=>{let vis=L.sc===curSc&&L.vis();if(vis){pv.copy(L.p).project(ac);vis=pv.z<1&&Math.abs(pv.x)<1.1&&Math.abs(pv.y)<1.1}
    L.el.style.display=vis?'block':'none';if(vis){let x=(pv.x*.5+.5)*W;if(L.tr===TR.up||L.tr===TR.down){const ow=L.el.offsetWidth;x=Math.max(8+ow/2,Math.min(W-8-ow/2,x))}L.el.style.transform=`translate(${x}px,${(-pv.y*.5+.5)*H}px) ${L.tr}`}});
  requestAnimationFrame(frame);
}
try{$('#more').open=localStorage.getItem('moreOpen')==='1'}catch(e){}
$('#more').addEventListener('toggle',()=>{try{localStorage.setItem('moreOpen',$('#more').open?'1':'0')}catch(e){}});
renderStep=PED.wrap(renderStep,()=>S.step);function saveQ(){const need=STEPS.length-1,ok=[...Array(need).keys()].every(i=>S.done.has(i));$('#lvlDone').hidden=!ok;try{const q=JSON.parse(localStorage.getItem('quest_v1')||'{}');q.steps=q.steps||{};q.done=q.done||{};q.steps[1]=[...S.done];if(ok)q.done[1]=true;localStorage.setItem('quest_v1',JSON.stringify(q))}catch(e){}}
try{(JSON.parse(localStorage.getItem('quest_v1')||'{}').steps||{})[1]?.forEach(i=>S.done.add(i))}catch(e){}
renderStep();frame();
}
