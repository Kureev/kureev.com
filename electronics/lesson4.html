<style>
/* VOICE everyday learning, a workbench lesson for a software engineer
   IDEA the rail of his own robot-arm board sags when the servos lunge; a capacitor is a tank that covers the gap
   PICTURE live 3D board from level 1 plus bulk capacitors and an oscilloscope; a water tank fed through a narrow pipe for charge, τ = R × C and discharge
   COLOUR night bench #050817, solder-mask green, copper, water blue, red for + and danger
   TYPE Manrope 800 + Manrope
   LAYOUT laptop: 3D stage left, lesson column 410px right; phone: stage on top, lesson below; only the controls a step needs are shown */
:root{color-scheme:dark;--bg:#050817;--panel:#0a1230;--card:#0e1840;--line:#1e2a5c;--ink:#eef1ff;--mute:#8f9bc4;--cu:#e39a52;--hot:#ff5a3c;--ok:#5fd38d;--warn:#ffc14d}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%}
.stage{position:relative;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;font:600 13px/1.2 Manrope,sans-serif;padding:3px 8px;border-radius:6px;background:rgba(5,8,23,.82);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.lb.big{font-size:15px;color:#ffd1c4;border-color:#6b2a1c}
.lb.flow{color:#bfe3ff;border-color:#24496b}
.lb.lvl{background:none;border:0;color:var(--mute);font-size:12px;padding:0}
.lb.bad{color:#ffb39f;border-color:#6b2a1c}
.lb.good{color:#9ff0c0;border-color:#2f4a9e}
.lb.dim{color:var(--mute);border-style:dashed;font-weight:400}
.tools{position:absolute;left:16px;top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.reset{min-height:36px;font-size:14px;background:rgba(14,22,60,.9)}
.hint{font-size:13px;color:var(--mute);background:rgba(5,8,23,.7);padding:4px 10px;border-radius:8px}
.info{position:absolute;right:16px;top:14px;width:min(300px,calc(100% - 32px));background:rgba(14,22,60,.96);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.info b{display:block;font-size:15px;margin:0 28px 4px 0}
.info p{margin:0;color:#c9d2f5}
.x{position:absolute;right:6px;top:4px;width:32px;height:32px;min-height:0;padding:0;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;border-radius:8px}
.panel{overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);padding:22px 20px 28px}
h1{font:800 31px/1.06 Manrope,sans-serif;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.sub{margin:0 0 16px;color:var(--mute);font-size:15px}
.card,.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.stephead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mute);font-size:13px;font-weight:600;flex-wrap:wrap}
.part{color:var(--cu)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:13px;height:13px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer}
.dots button.on{background:var(--ink);border-color:var(--ink)}
.dots button.done{border-color:var(--ok)}
.dots button.on.done{background:var(--ok)}
h2{font:800 22px/1.15 Manrope,sans-serif;margin:8px 0 8px;letter-spacing:-.01em}
.stepb p,.stepb ol,.stepb ul{margin:0 0 10px}
.stepb ol,.stepb ul{padding-left:20px}
.stepb li{margin-bottom:4px}
.stepb .note{font-size:14px;color:var(--mute)}
.stepb b{color:#fff}
.after{border-left:3px solid var(--ok);padding:2px 0 2px 12px;margin:0 0 10px}
.after p{margin:0 0 8px}
.task{border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;background:#151d45;border:1px solid #2e3a78;color:var(--warn)}
.task.ok{color:var(--ok);border-color:#2f4a9e;background:#0f1d4a}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
button{font:600 15px Manrope,sans-serif;color:var(--ink);background:#141f4d;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
button:hover{border-color:#33407a}
button:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
button.pri{background:var(--ink);color:#050817;border-color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
.ctl label{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px;margin-top:4px}
output{color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--cu);cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row>*{flex:1 1 140px}
.row button[aria-pressed=true]{border-color:var(--ok);color:var(--ok)}
.danger{background:#3a1b14;border-color:#a33d22;color:#ffd1c4}
.fix{width:100%;margin-top:4px;background:#3a1b14;border-color:#6b2a1c;color:#ffb39f}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.num span{display:block;font-size:13px;color:var(--mute)}
.num b{font:800 22px/1.2 Manrope,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.num.u b{color:#ff8a70}.num.i b{color:#8fd0ff}.num.p b{color:#ff6a4d}.num.g b{color:#9ff0c0}
.st{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 0}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.g{color:var(--ok);border-color:#2f4a9e}.pill.y{color:var(--warn);border-color:#5a4a1f}.pill.r{color:#ff8a70;border-color:#6b2a1c}.pill.m{color:var(--mute)}
.formula{grid-column:1/-1;margin:0;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.6;color:#c9d2f5}
.hw{list-style:none;padding:0!important;margin:0 0 10px}
.hw li{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:14px}
.hw input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.err{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);padding:20px;text-align:center}
@media(max-width:900px){
html,body{height:auto}
.app{grid-template-columns:minmax(0,1fr);height:auto}
.stage{height:62svh;min-height:360px}
.panel{border-left:0;border-top:1px solid var(--line);padding:18px 16px 28px}
.hint{display:none}
.info{right:10px;top:10px}
.lb{font-size:11px;padding:2px 5px}
.lb.part{display:none!important}
}

.lead{font-size:16px;line-height:1.5;margin:0 0 12px}.lead b{color:#fff}
.step .card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 0 4px;margin:0 0 10px}
.step .after{margin:10px 0 0}
.stepx:empty{display:none}.stepx{margin-top:12px}.stepx p{margin:0 0 10px}
.stepx table{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 10px}
.more{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.more summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:40px;font-weight:700;font-size:15px;color:var(--mute)}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.more[open] summary::before{transform:rotate(45deg)}
.more summary:hover{color:var(--ink)}
.blocks{display:grid;gap:8px;margin-top:4px}
.blk{background:#131c46;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.blk h3{margin:0 0 4px;font:800 12px/1.3 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--cu)}
.blk p,.blk ul,.blk ol{margin:0 0 6px}.blk>:last-child{margin-bottom:0}
.blk ul,.blk ol{padding-left:20px}
.blk b{color:#fff}
.blk.note{background:none;border-style:dashed;color:var(--mute);font-size:14px}
.blk.note h3{color:var(--mute)}
.blk table{width:100%;border-collapse:collapse;font-size:14px}
.blk th{text-align:left;color:var(--mute);font-weight:600;font-size:13px;border-bottom:1px solid var(--line);padding:4px 6px 4px 0}
.blk td{border-bottom:1px solid var(--line);padding:5px 6px 5px 0;vertical-align:top}
.hud{position:absolute;right:12px;bottom:12px;display:flex;flex-flow:row wrap;justify-content:flex-end;align-content:flex-end;gap:6px;max-width:min(460px,calc(100% - 24px));pointer-events:none;background:none;border:0;padding:0;margin:0}
.hud .num{display:flex;align-items:baseline;gap:10px;background:rgba(5,8,23,.86);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.hud .num span{display:inline;font-size:12px}
.hud .num b{font-size:18px}
.hud .st{margin:0;justify-content:flex-end;flex:1 0 100%}.hud .pill{background:rgba(5,8,23,.86)}
.hud .formula{border:1px solid var(--line);border-radius:10px;background:rgba(5,8,23,.86);padding:7px 10px;font-size:13px;line-height:1.5;text-align:right}
.hud .formula:empty{display:none}
@media(max-width:900px){.hud{right:8px;bottom:8px;gap:4px;max-width:calc(100% - 16px)}.hud .num{padding:2px 8px}.hud .num span{font-size:11px}.hud .num b{font-size:15px}.hud .formula{font-size:11px;padding:5px 8px;max-width:100%}}

/* panel v2: one header line, segmented progress, goal row, sticky footer */
.app{grid-template-columns:minmax(0,1fr) 384px}
.panel{display:flex;flex-direction:column;padding:0}
.ph{display:flex;align-items:baseline;gap:10px;padding:16px 20px 0;font-size:13px;color:var(--mute);flex-wrap:wrap}
.ph .ltitle{color:var(--ink);font-weight:700;font-size:14px}
.ph .back{margin:0;font-size:13px}
.step{background:none;border:0;border-radius:0;padding:14px 20px 10px;margin:0;flex:1 0 auto}
.prog{margin:0 0 2px}
.ptop{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.ptop .part{color:var(--cu)}
#stepC{font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;flex-wrap:nowrap}
.dots button{flex:1 1 0;height:16px;min-height:0;padding:0;border:0;border-radius:0;cursor:pointer;background:linear-gradient(var(--line),var(--line)) center/100% 5px no-repeat}
.dots button.pb{margin-left:7px}
.dots button.done{background-image:linear-gradient(#3b5bd9,#3b5bd9)}
.dots button.on{background-image:linear-gradient(var(--ink),var(--ink));background-size:100% 7px}
.dots button.on.done{background-image:linear-gradient(var(--ok),var(--ok))}
.dots button:hover{background-size:100% 7px}
h2{font-size:23px;margin:10px 0 6px}
.lead{margin:0 0 6px}
.step .card{border-top:0;padding:6px 0 0;margin:0 0 6px}
.task{display:flex;gap:10px;align-items:flex-start;background:#121b48;border:1px solid #2e3a78;border-radius:12px;padding:10px 12px;color:var(--ink);font-size:15px;font-weight:600;line-height:1.4}
.task .tick{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--warn);margin-top:0;position:relative}
.task.ok{background:#0d1a45;border-color:#2f4a9e;color:#dbe2ff}
.task.ok .tick{background:var(--ok);border-color:var(--ok)}
.task.ok .tick::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #050817;border-width:0 2px 2px 0;transform:rotate(45deg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.more summary .cnt{font-weight:600;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:2px}
.nav{position:sticky;bottom:0;z-index:3;margin:0;padding:12px 20px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px}
.nav #prev{flex:none;width:48px;padding:0;font-size:22px;line-height:1}
.nav #next{flex:1}
.lvl-done{margin:0 20px 12px!important}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.ph{padding:14px 16px 0}.step{padding:12px 16px 8px}.nav{padding:10px 16px calc(10px + env(safe-area-inset-bottom))}}
/* polish v2 */
.lb{font-weight:500;font-size:12px;line-height:16px;padding:2px 7px;color:#dfe4fb;background:rgba(6,10,30,.86);border-color:rgba(255,255,255,.08)}
.lb.tp{color:#e3b27a;border-color:rgba(255,255,255,.08)}

.lb.bad{border-color:rgba(255,120,90,.35)}.lb.good{border-color:rgba(95,211,141,.3)}

.lcd{background:#c7d1b0;font-size:30px}.next{color:#8f9bc4}
.reset{min-height:32px;font-size:13px;padding:4px 12px;background:rgba(10,16,44,.8)}

.row button[aria-pressed=true]{background:rgba(95,211,141,.1)}

.side{display:flex;flex-direction:column;gap:6px;margin:4px 0 14px}
.side:empty{display:none}
.side .formula{margin:0;padding:0;border:0;background:none;font-size:13px;line-height:18px;color:#a3acd0;text-align:left;font-variant-numeric:tabular-nums}

.side .st{margin:0;justify-content:flex-start}
@media(max-width:900px){
 .stage{height:46svh;min-height:300px}
 .meter{left:auto;right:8px;top:8px;bottom:auto;width:150px;padding:7px 9px 8px}

/* brand v1 */
:root{--blue:#5b9cff;--violet:#8a6bff;--grad:linear-gradient(100deg,#5b9cff,#8a6bff 60%,#c77dff);--ok:#59f3a8;--warn:#ffb26b}
body{background:radial-gradient(60% 50% at 20% 0%,rgba(40,70,190,.18),transparent 70%),var(--bg)}
.panel{background:linear-gradient(180deg,#0a1230,#070c24 60%)}
h1,h2,.ltitle{font-family:Unbounded,Manrope,sans-serif;font-weight:600;letter-spacing:-.02em}
h2#stepT{font-size:clamp(19px,1.7vw,23px);line-height:1.2}
button.pri,a.go{background:#E8ECFF;color:#0A0F2E;border-color:#E8ECFF;border-radius:999px}

a.go.ghost{background:rgba(140,160,255,.08);color:var(--ink);border-color:rgba(140,160,255,.25)}

input[type=range]{accent-color:#7d8cff}

.formula,.side .formula{font-size:13px;line-height:1.5;color:#b4bde0}

<style>
/* level 4: heat readouts, the regulator glow, the load-step scope */
.scope{position:absolute;left:16px;bottom:16px;width:min(420px,calc(100% - var(--pw,0px) - 40px));padding:12px 14px 12px;border-radius:16px;background:rgba(10,15,40,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(140,160,255,.16);pointer-events:none;margin:0}
.scope .sh{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;font:600 13px/1.3 Manrope,sans-serif;color:#8f9bc4}
.scope .sh b{color:#eef1ff;font-weight:600;flex:none}
.scope #scS{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scope .rd{flex:none;margin-left:auto;font:700 15px/1.2 Manrope,sans-serif;color:#eef1ff;font-variant-numeric:tabular-nums;white-space:nowrap}
.scope canvas{display:block;width:100%;height:170px;border-radius:8px;background:#060a1e}
.scope .sk{display:flex;justify-content:space-between;gap:8px;margin:6px 0 0;font:500 13px/1.3 Manrope,sans-serif;color:#8f9bc4;font-variant-numeric:tabular-nums}
.scope .lg{display:flex;gap:14px;margin:6px 0 0;font:500 13px/1.3 Manrope,sans-serif;color:#8f9bc4}
.scope .lg>span{display:grid;grid-template-columns:14px auto;column-gap:6px;align-items:baseline}.scope .lg i{display:inline-block;width:14px;height:3px;border-radius:2px;align-self:center}.scope .lg em{display:block;font-style:normal;color:#8f9bc4}
.wnote{text-wrap:pretty;margin:10px 0 0;font:500 13px/1.4 Manrope,sans-serif;color:#a3acd0;font-variant-numeric:tabular-nums}
.num.h b{color:#ffb26b}.num.h.bad b{color:#ff8a70}
.row button[aria-pressed=true].danger{border-color:#ff8a70}
@media(min-width:901px){.app{--pw:calc(clamp(420px,31vw,500px) + 24px)}}
@media(max-width:900px){.scope .sh{flex-wrap:wrap;row-gap:2px}.scope #scS{order:3;flex-basis:100%}.stage{height:60svh!important;min-height:440px!important}.scope{left:8px;right:8px;top:68px;bottom:auto;width:auto;padding:8px 10px}.scope canvas{height:88px}.scope .sh{margin-bottom:6px}.scope .sk,.scope .lg em{display:none}.scope .lg{margin-top:4px}}

<body>
<a class="skip" href="#stepT">Skip to the lesson</a>
<div class="app">
  <section class="stage" id="stage">
    <canvas id="gl" aria-label="3D model of the lesson"></canvas>
    <div class="labels" id="labels"></div>
    <figure class="scope" id="scope" data-ui="scope" aria-label="Oscilloscope">
      <figcaption class="sh"><b id="scT">Oscilloscope</b><span id="scS"></span><span class="rd" id="scR" aria-live="polite"></span></figcaption>
      <canvas id="scv" role="img" aria-label="Output voltage and load current over time"></canvas>
      <p class="lg" id="scL"></p>
      <p class="sk"><span id="scX"></span><span id="scY"></span></p>
    </figure>
    <section class="hud" id="hud" data-grp aria-live="polite">
      <div class="num u" data-ui="wnV"><span>Level for the ESP32</span><b id="wnV"></b></div>
      <div class="num i" data-ui="wnI"><span>Flow into the ESP32</span><b id="wnI"></b></div>
      <div class="num h" data-ui="wnW"><span>Turned into heat</span><b id="wnW"></b></div>
      <p class="formula" data-ui="wF" id="wF"></p>
      <div class="num u" data-ui="nUin"><span>In</span><b id="nUin"></b></div>

function plot(o){const dpr=Math.min(devicePixelRatio||1,2),W=scv.clientWidth,H=scv.clientHeight;if(!W||!H)return;
  if(scv.width!==Math.round(W*dpr)||scv.height!==Math.round(H*dpr)){scv.width=Math.round(W*dpr);scv.height=Math.round(H*dpr)}
  const x=sx;x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);x.strokeStyle='rgba(143,155,196,.13)';x.lineWidth=1;
  for(let i=0;i<=10;i++){const px=Math.round(i*W/10)+.5;x.beginPath();x.moveTo(px,0);x.lineTo(px,H);x.stroke()}
  for(let j=0;j<=6;j++){const py=Math.round(j*H/6)+.5;x.beginPath();x.moveTo(0,py);x.lineTo(W,py);x.stroke()}
  const draw=(arr,lo,hi,c)=>{if(!arr||arr.length<2)return;x.strokeStyle=c;x.lineWidth=2;x.lineJoin='round';x.beginPath();arr.forEach(([t,v],i)=>{const px=t*W,py=H-3-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(H-6);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()};

{sc:'w',part:'Holding the level',t:'The ESP32 needs 3.3 V',s:"The arm’s brain, the <b>ESP32</b>, runs on <b>3.3 V</b>, and the board has <b>12 V</b>. In level 1 you made a lower voltage with a divider. This one gives exactly 3.3 V with nothing connected. Now wake the ESP32 up.",bt:["How much it eats","Why it collapses","Where a divider works"],ui:['load','wSmall','wNote','wnV','wnI','wnW','wF'],enter:()=>{S.load='sleep';S.small=false;S.tried.clear()},
 b:"<p>An ESP32 draws almost nothing asleep, about 80 mA idle, and up to about 250 mA in bursts when Wi-Fi transmits. Below about 3.0 V it starts resetting.</p><p>The ESP32 sits in parallel with R2. At 80 mA and 3.3 V it behaves like a resistor of about 41 Ω, next to R2’s 3.3 kΩ. The bottom of the divider shrinks to about 41 Ω, and the middle point drops with it.</p><p class=\"note\">A divider is fine for signals: a meter or a chip input takes almost no current.</p>",
 after:"<p>Idle, the ESP32 got about 0.06 V instead of 3.3 V. With resistors 100× smaller it got about 2.1 V idle and 1.2 V on Wi-Fi, and the divider burnt about 1.2 W even while the ESP32 slept.</p><p>A divider’s output depends on what you connect. We need something that <b>watches</b> the output and lets through exactly as much as the load takes.</p>",
 task:'Wake the ESP32 and turn Wi-Fi on, then try resistors 100× smaller',ok:()=>S.tried.has('0:wifi')&&S.tried.has('small:wifi')},
{sc:'w',part:'Holding the level',t:'A float valve',s:"Swap R1 for a <b>float valve</b>, like the one in a toilet cistern. The level drops, the float sinks and opens the valve; the level rises, the valve closes. Switch the ESP32 between idle and Wi-Fi.",bt:["The linear regulator","The price"],ui:['load','wNote','wnV','wnI','wnW','wF'],enter:()=>{S.load='idle';S.tried.clear()},
 b:"<p>That’s a <b>linear regulator</b>. Inside, a transistor plays the valve and a small circuit plays the float: it compares the output with a reference voltage and opens the transistor more or less, far faster than any float.</p><p>The water still falls from 12 V to 3.3 V on its way through the valve, and that fall turns into heat: <b>P = (U in − U out) × I</b>.</p>",
 after:"<p>The level stayed at 3.3 V whatever the ESP32 did; the valve just opened wider. But the heat followed the current: about 0.7 W idle, about 2.2 W on Wi-Fi. Of the 12 V you pay for, the ESP32 uses 3.3 V and the valve burns 8.7 V.</p>",
 task:'Turn Wi-Fi on, then back to idle, and watch the heat',ok:()=>S.tried.has('1:wifi')&&(S.tried.has('1:idle')||S.tried.has('1:sleep'))},
{sc:'b',kind:'ldo',part:'Linear',t:'AMS1117 straight from 12 V',s:"On the board the float valve is an <b>AMS1117-3.3</b>, a small three-legged chip that gives 3.3 V. Here a jumper wires it straight to the 12 V rail. Turn Wi-Fi on.",bt:["Watts in, degrees out","Self-protection","What helps"],ui:['load','nUout','nP','nT','nEta','pills','bF'],enter:()=>{S.mode='ldo12';S.load='idle';S.T=TAMB;S.off=false;S.fl.shut=false},
 b:"<p>The chip turns P = (12 V − 3.3 V) × I into heat. How hot it gets depends on how well that heat leaves: an AMS1117 on a small board warms by about 90 °C for every watt.</p><p>Above about 150 °C the chip switches itself off to survive. It cools, switches back on, and heats up again. The ESP32 resets every time.</p><p class=\"note\">More copper under the tab, or a heatsink, lowers the degrees per watt. It doesn’t lower the watts.</p>",
 after:"<p>Idle: 8.7 V × 0.08 A ≈ 0.7 W, about 88 °C. It works, but you can’t touch it. On Wi-Fi: 8.7 V × 0.25 A ≈ 2.2 W, about 220 °C on paper. The chip never gets there; it shuts down at about 150 °C, again and again.</p><p>Efficiency: 3.3 / 12 ≈ 27%. Almost three quarters of what you pay for is heat.</p>",
 task:'Turn Wi-Fi on and wait until the regulator gives up',ok:()=>S.fl.shut},
{sc:'b',kind:'bench',part:'Linear',t:'Dropout: how low can the input go',s:"Less fall, less heat: feed the AMS1117 something closer to 3.3 V. A bench supply stands in for the 12 V, and the ESP32 is on Wi-Fi. How low can you go?",bt:["Dropout","Why 5 V"],ui:['bVin','nUout','nP','nT','pills','bF'],enter:()=>{S.vin=5;S.load='wifi';S.off=false;S.T=TAMB;S.fl.sag=false},
 b:"<p>The valve needs some pressure across it to work. For the AMS1117 that’s about <b>1.1 V</b>, the <b>dropout</b>: the input has to stay at least 1.1 V above the output. Below that, the output just follows the input, 1.1 V lower.</p><p>5 V is a good input: 1.7 V of headroom, and only about 0.4 W at 0.25 A. Many ESP32 dev boards do exactly this: 5 V from USB into an AMS1117.</p><p class=\"note\">LDO stands for low-dropout regulator. The AMS1117 is an old design with a large dropout; modern LDOs need 0.1–0.3 V.</p>",
 after:"<p>3.3 V held down to an input of 4.4 V = 3.3 V + 1.1 V. At 4.0 V the output was 2.9 V and the ESP32 was on the edge; below about 3.6 V it went off. At 5 V on Wi-Fi: (5 − 3.3) × 0.25 ≈ 0.43 W, about 63 °C.</p>",
 task:'Find the lowest input that still gives 3.3 V',ok:()=>S.fl.sag&&Math.abs(S.vin-4.4)<0.05},
{sc:'b',kind:'buck',part:'Switching',t:'Buck converter: 12 V → 5 V',s:"So where does 5 V come from without the heat? From level 3: switch 12 V fast into a coil and the load gets the average. This little board, an <b>MP1584</b> module, does it about a million times a second. Change the load.",bt:["Inside the module","Watts in, watts out","Efficiency"],ui:['bLoad5','nIin','nIout','nP','nEta','pills','bF'],enter:()=>{S.o5=1;S.tried.clear()},
 b:"<p>The chip is the switch and the brain. Around it sit the coil, the Schottky diode and the capacitors from levels 2 and 3. The chip watches the output and adjusts D to hold 5 V: D ≈ 5 / 12 ≈ 42%, a little more to cover the diode.</p><p>A buck converter doesn’t burn the difference, it trades voltage for current. Power in ≈ power out: <b>12 V × I in ≈ 5 V × I out / η</b>.</p><p class=\"note\">Efficiency η is power out over power in. Small modules like this reach about 90% at a few hundred milliamps; at light load the chip’s own consumption takes a bigger share.</p>",
 after:"<p>At 0.5 A out it took only about 0.23 A from 12 V: <b>less current in than out</b>. The module burns about 0.3 W at 0.5 A, warm but not hot. An AMS1117 making 5 V from 12 V at 0.5 A would burn 3.5 W.</p>",
 task:'Try all three loads and compare the current in and out',ok:()=>S.tried.has('o5:0')&&S.tried.has('o5:2')},
{sc:'b',kind:'buck',part:'Switching',t:'A sudden load',s:"Servos and Wi-Fi don’t ask politely: their current jumps within microseconds. Jump the load from 0.1 A to 1 A and watch the 5 V output on the scope.",bt:["Who covers the gap","What the chip does"],ui:['bJump','scope','nUout','nIout','pills'],enter:()=>{S.o5=0;S.fl.jump=false},
 b:"<p>The coil can’t speed its current up instantly (level 3). For those first microseconds the output capacitor (level 2) feeds the load alone, and its voltage sags.</p><p>The chip sees the sag and keeps the switch closed longer each cycle until the coil’s current catches up. Then it settles at the new D.</p>",
 after:"<p>The output dipped by about 0.15 V for some 10 µs and was back at 5 V within about 60 µs. A bigger output capacitor makes the dip smaller. An ESP32 behind an LDO won’t notice it at all: with 1.7 V of headroom, the LDO swallows the dip.</p>",
 task:'Jump the load and watch the scope',ok:()=>S.fl.jump},
{sc:'b',kind:'ldo',part:'Switching',t:'Buck, then LDO',s:"Now both together: the buck makes 5 V from 12 V, and the AMS1117 makes 3.3 V from 5 V. The ESP32 is on Wi-Fi. Compare with the LDO straight from 12 V.",bt:["Why two","On the arm"],ui:['bMode','nIin','nP','nT','nEta','pills','bF'],enter:()=>{S.mode='chain';S.load='wifi';S.T=TAMB;S.off=false;S.tried.clear()},
 b:"<p>The buck does the big drop cheaply. The LDO does the small last step and smooths out the buck’s ripple and dips, which radios and sensors like.</p><p>On the arm’s board: 12 V goes to the servos, a buck makes 5 V for the logic, and an LDO makes 3.3 V for the ESP32.</p>",
 after:"<p>Straight from 12 V: about 2.2 W of heat and a chip that keeps shutting down. Buck then LDO: about 0.43 W in the LDO and 0.15 W in the buck, about four times less, and the LDO stays near 63 °C. The 12 V side carries half the current: about 0.12 A instead of 0.25 A.</p>",
 task:'Try both, and leave the one that runs cool',ok:()=>S.tried.has('mode:ldo12')&&S.mode==='chain'},
{sc:'b',kind:'ldo',part:'Practice',t:'Problem book',s:"Seven problems from real life, from a worked example to finding someone else’s slip. Hints are free; there are no lives to lose.",bt:[],ui:[],enter:()=>{S.mode='chain';S.load='idle';S.off=false},
 b:"<div class=\"book\" data-book=\"l4\"></div>",
 task:"Solve every problem (hints are fine)",ok:()=>BOOK.solved("l4")},
{sc:'b',kind:'ldo',part:'Wrap-up',t:'What we built, and homework',s:"A linear regulator burns the difference; a buck converter trades it for current. Use the buck for big drops and the LDO for small, clean ones.",bt:["-","Next"],ui:[],enter:()=>{S.mode='chain';S.load='idle';S.off=false},
 b:_t('<p>The power chain: 12 V → buck (MP1584) → 5 V → AMS1117 → 3.3 V → ESP32. About 0.6 W of heat, where a single LDO would burn 2.2 W and keep shutting down.</p>')+'<ul class="hw">'+['Look at your FE-URT-2 servo adapter: find the small regulator chip near the USB connector, read its marking and look it up. If there isn’t one, find out where its 3.3 V comes from.','Before connecting anything to an MP1584 module, power it from 12 V and turn its trimmer until a multimeter reads 5.0 V at the output.','Load the module with a 10 Ω, 5 W resistor (0.5 A at 5 V), measure the current in and out, and work out the efficiency.','Run Wi-Fi on an ESP32 dev board from USB for a minute, then touch its AMS1117: warm, not hot.'].map((t,i)=>`<li><input type="checkbox" id="hw${i}" ${hw[i]?'checked':''}><label for="hw${i}">${_t(t)}</label></li>`).join('')+'</ul>'+_t('<p class="note">Next up, level 5: the transistor switch. Turning a load on and off with a signal.</p>'),
 task:'Tick all four items',ok:()=>[0,1,2,3].every(i=>hw[i])}];

      if(!S.off&&S.T>=TOFF){S.off=true;S.cyc++;if(st.kind==='ldo'&&S.mode==='ldo12'&&S.load==='wifi')S.fl.shut=true;S.need=true}else if(S.off&&S.T<=TON){S.off=false;S.need=true}
      if(Math.abs(S.T-T0)>0.05)dirty=true;
      const h=Math.max(0,Math.min(1,(S.T-45)/110)),hg=Math.max(0,Math.min(1,(S.T-90)/60));mLdo.emissive.setRGB(hg*0.05,hg*0.01,0);ldoGlow.intensity=h*0.5;
      heat.forEach(o=>{o.life-=dt*0.7;if(o.life<=0){o.life=1;o.m.position.set(1.2+(Math.random()-.5)*0.5,0.3,-1.75+(Math.random()-.5)*0.3)}o.m.position.y+=dt*0.6;o.m.material.opacity=h>0.25?Math.max(0,o.life)*0.35*h:0});
      const on=B.esp==='ok'?1:B.esp==='brown'?(Math.random()<0.5?0.4:0):0;mLed.emissiveIntensity=on*1.6;espLight.intensity=on*0.8}
    else{mLdo.emissive.setRGB(0,0,0);ldoGlow.intensity=0;heat.forEach(o=>o.m.material.opacity=0)}
    if(S.jmp&&S.jp<1){S.jp=Math.min(1,S.jp+raw/2.2);if(S.jp>0.2)S.o5=2;if(S.jp>=1){S.fl.jump=true;S.need=true}dirty=true}
    const k=st.kind,ch=k==='ldo'&&S.mode==='chain',inP=k==='bench'?PIN_BENCH:(k==='buck'||ch)?PIN_A:PIN_J,outP=k==='buck'?POUT_B:ch?POUT_C:null;
    const sp=i=>i>0.002?Math.min(9,0.5+9*i):0;fIn+=sp(B.Iin)*dt*slow;fOut+=sp(B.Iout)*dt*slow;const hid=p=>(p.x>3.1&&p.x<4.5&&p.z>-1.7&&p.z<0.9&&gEsp.visible)||(p.x>-2.6&&p.x<-0.4&&p.z>-2.03&&p.z<-0.43&&gBuck.visible)||(p.x>0.8&&p.x<1.7&&p.z>-2.2&&p.z<-1.4&&gLdo.visible)?0.02:0;
    for(let i=0;i<NP;i++){pathAt(inP,fIn+i*inP.T/NP,pv);dummy.position.set(pv.x,hid(pv)||Math.max(0.11,pv.y),pv.z);dummy.scale.setScalar(sp(B.Iin)?1:0);dummy.updateMatrix();dIn.setMatrixAt(i,dummy.matrix);
      if(outP){pathAt(outP,fOut+i*outP.T/NP,pv);dummy.position.set(pv.x,hid(pv)||Math.max(0.13,pv.y),pv.z);dummy.scale.setScalar(sp(B.Iout)?0.9:0)}else dummy.scale.setScalar(0);dummy.updateMatrix();dOut.setMatrixAt(i,dummy.matrix)}
    dIn.instanceMatrix.needsUpdate=dOut.instanceMatrix.needsUpdate=true;
    gl.render(scB,cam);
  }
  uiT+=raw;if(S.need||dirty&&uiT>0.08){S.need=false;uiT=0;update()}
  const W=stage.clientWidth,H=stage.clientHeight;
  labels.forEach(L=>{let vis=L.sc===curSc&&L.vis();if(vis){pv.copy(L.p).project(cam);vis=pv.z<1&&Math.abs(pv.x)<1.0&&Math.abs(pv.y)<1.0}
    L.el.style.display=vis?'block':'none';if(vis){let x=(pv.x*.5+.5)*W;if(L.tr===TR.up||L.tr===TR.down){const ow=L.el.offsetWidth;x=Math.max(8+ow/2,Math.min(W-(window.PW?PW():0)-8-ow/2,x))}L.el.style.transform=`translate(${x}px,${(-pv.y*.5+.5)*H}px) ${L.tr}`}});
  requestAnimationFrame(frame);
}

$('#more').addEventListener('toggle',()=>{try{localStorage.setItem('moreOpen',$('#more').open?'1':'0')}catch(e){}});
renderStep=PED.wrap(renderStep,()=>S.step);BOOK.onchange=()=>update();
SCHEM.def('l4',()=>{const st=STEPS[S.step];return{sc:st.sc,auto:S.step===STEPS.length-1,kind:st.kind,mode:S.mode,vin:S.vin,o5:O5[S.o5]}});
function saveQ(){const need=STEPS.length-1,ok=[...Array(need).keys()].every(i=>S.done.has(i));let was=false;try{const q=JSON.parse(localStorage.getItem('quest_v1')||'{}');q.steps=q.steps||{};q.done=q.done||{};was=!!q.done[4];q.steps[4]=[...S.done];if(ok)q.done[4]=true;localStorage.setItem('quest_v1',JSON.stringify(q))}catch(e){}if(window.PED&&PED.complete)PED.complete(ok,was)}
try{(JSON.parse(localStorage.getItem('quest_v1')||'{}').steps||{})[4]?.forEach(i=>S.done.add(i))}catch(e){}
renderStep();frame();
window.__L4={S,STEPS,update,board,divider,cam,ctl,dIn,dOut,scB};
}
