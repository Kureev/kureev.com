<style>
/* VOICE everyday learning quest: a workbench at night where your own arm comes alive level by level
   IDEA the bench itself is the map: a ghost circuit board fills in section by section, the arm beside it wakes up
   PICTURE live 3D bench: arm, board with 8 sections, multimeter, cable from servo bus to the arm
   COLOUR night bench #050817, solder-mask green, copper, servo blue, power-LED green, locked parts as dashed ghosts
   TYPE Manrope 800 + Manrope
   LAYOUT laptop: 3D bench left, quest column 410px right (progress, levels, inventory); phone: bench on top */
:root{color-scheme:dark;--bg:#050817;--panel:#0a1230;--card:#0e1840;--line:#1e2a5c;--ink:#eef1ff;--mute:#8f9bc4;--cu:#e39a52;--ok:#5fd38d;--warn:#ffc14d}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%}
.stage{position:relative;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;font:600 13px/1.2 Manrope,sans-serif;padding:3px 8px;border-radius:6px;background:rgba(5,8,23,.82);border:1px dashed #33407a;white-space:nowrap;color:var(--mute)}
.lb.done{border:1px solid #2f4a9e;color:#9ff0c0}
.lb.open{border:1px solid #5a4a1f;color:var(--warn)}
.tools{position:absolute;left:16px;top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute);background:rgba(5,8,23,.7);padding:4px 10px;border-radius:8px}
.info{position:absolute;right:16px;bottom:16px;width:min(320px,calc(100% - 32px));background:rgba(14,22,60,.96);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.info b{display:block;font-size:15px;margin:0 28px 4px 0}.info p{margin:0 0 8px;color:#c9d2f5}
.x{position:absolute;right:6px;top:4px;width:32px;height:32px;min-height:0;padding:0;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer}
.panel{overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);padding:22px 20px 28px}

.sub{margin:0 0 16px;color:var(--mute);font-size:15px}

.lv{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}

.lv.done .n{background:var(--ok);border-color:var(--ok);color:#050817}
.lv.open .n{border-color:var(--warn);color:var(--warn)}
.lv .t{font-weight:700;line-height:1.25}.lv .g{font-size:13px;color:var(--mute);line-height:1.35}
.lv.locked{opacity:.55}
a.go,button{font:600 14px Manrope,sans-serif;color:#050817;background:var(--ink);border:1px solid var(--ink);border-radius:10px;min-height:40px;padding:0 12px;display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap;cursor:pointer}
a.go.ghost,button.ghost{background:none;color:var(--ink);border-color:var(--line)}
.st{font-size:12px;color:var(--mute);white-space:nowrap}
a:focus-visible,button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.card b{display:block;font-size:14px}.card span{display:block;font-size:13px;color:var(--mute);line-height:1.35;margin-top:2px}
.card.lock{border-style:dashed;opacity:.5}
.foot{margin-top:18px;font-size:13px;color:var(--mute)}

.panel{background:linear-gradient(180deg,#0a1230,#070c24 60%)}
h1,h2,.ltitle{font-family:Unbounded,Manrope,sans-serif;font-weight:600;letter-spacing:-.02em}
h2#stepT{font-size:clamp(19px,1.7vw,23px);line-height:1.2}
button.pri,a.go{background:#E8ECFF;color:#0A0F2E;border-color:#E8ECFF;border-radius:999px}
button.pri:hover,a.go:hover{background:#fff}

.bar i{background:var(--grad)}
.lb.tp{color:#ffc58f}

.row button,#prev{border-radius:999px;background:rgba(91,156,255,.08);border:1px solid rgba(91,156,255,.35)}
.formula,.side .formula{font-size:13px;line-height:1.5;color:#b4bde0}
.row button[aria-pressed=true]{border-color:rgba(91,156,255,.8);color:#dbe4ff;background:rgba(91,156,255,.18)}
.task .tick{border-color:#8a9bff}
.meter{border-color:rgba(140,160,255,.25);box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(140,160,255,.12)}
/* studio v1 */
.stage{background:#050817 url(/electronics/studio.webp) center 30%/cover no-repeat}
.stage::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(5,8,23,.75)),linear-gradient(180deg,rgba(5,8,23,.15),rgba(5,8,23,0) 30%,rgba(5,8,23,.35))}
.stage>*{z-index:1}
.app{grid-template-columns:minmax(0,1fr) 460px}
h1{font-size:30px;line-height:1.08}
.sub{font-size:15px;line-height:1.5;color:#a3acd0;margin-bottom:18px}
.prog{gap:14px;margin-bottom:18px}
.segs{flex:1;display:flex;gap:4px}.segs i{flex:1;height:4px;border-radius:2px;background:#1d2752}.segs i.d{background:linear-gradient(90deg,#5b9cff,#8a6bff)}.segs i.c{background:#33407a;box-shadow:inset 0 0 0 1px rgba(138,155,255,.7)}
.prog b{font:600 13px Manrope,sans-serif;color:#a3acd0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;margin:0;border:0;border-radius:16px;overflow:hidden;background:#0c1538;text-decoration:none;color:inherit;box-shadow:inset 0 0 0 1px rgba(140,160,255,.12);transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s}
a.lv:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(140,160,255,.35),0 12px 30px rgba(20,30,90,.5)}
.lv .art{display:block;aspect-ratio:16/11;overflow:hidden;background:#0a1230}
.lv .art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.22,1,.36,1)}
a.lv:hover .art img{transform:scale(1.04)}
.lv .meta{display:flex;flex-direction:column;gap:3px;padding:10px 12px 12px}
.lv .no{font:600 11px Manrope,sans-serif;letter-spacing:.04em;color:#8f9bc4}
.lv .t{font:600 15px/1.25 Unbounded,Manrope,sans-serif;letter-spacing:-.01em;color:#eef1ff}
.lv .g{font-size:12.5px;line-height:1.4;color:#a3acd0}
.lv .tag{margin-top:6px;align-self:flex-start;font:600 11.5px Manrope,sans-serif;padding:3px 9px;border-radius:999px;color:#a3acd0;background:rgba(140,160,255,.08)}
.lv.now{grid-column:1/-1;box-shadow:inset 0 0 0 1px rgba(138,155,255,.55),0 0 0 4px rgba(91,156,255,.08)}
.lv.now .art{aspect-ratio:16/8}.lv.now .t{font-size:18px}.lv.now .g{font-size:14px}
.lv.now .tag{color:#0A0F2E;background:#E8ECFF}
.lv.done .tag{color:#9fe8c4;background:rgba(89,243,168,.1)}
.lv.locked{opacity:1}.lv.locked .art img{filter:grayscale(.85) brightness(.55)}.lv.locked .t{color:#b4bce0}.lv.locked .g{color:#7d88b4}
.invd{margin-top:18px;border-radius:12px;background:rgba(91,156,255,.04)}
.invd summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;padding:12px 14px;font:600 14px Manrope,sans-serif;color:#c9d2f5}
.invd summary::-webkit-details-marker{display:none}.invd summary span{color:#8f9bc4;font-weight:500}
.invd .inv{padding:0 12px 12px}
.lb{background:rgba(5,8,23,.78);border:1px solid rgba(140,160,255,.18);color:#a3acd0;font-weight:500;font-size:12px}.lb.done{border-color:rgba(89,243,168,.35);color:#9fe8c4}.lb.open{border-color:rgba(255,178,107,.45);color:#ffc58f}
.hint{background:rgba(5,8,23,.55)}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.grid{grid-template-columns:1fr 1fr}.lv .g{display:none}.lv.now .g{display:block}}
@media(prefers-reduced-motion:reduce){.lv,.lv .art img{transition:none}}
.by{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;font-size:14px;font-weight:600;color:var(--mute);text-decoration:none}.by:hover{color:var(--ink)}.by img{border-radius:6px}</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <canvas id="gl" aria-label="3D bench: the arm and the board"></canvas>
    <div class="labels" id="labels"></div>
    <div class="tools"><span class="hint">Drag to rotate · click a board section to open a level</span></div>
    <aside class="info" id="info" hidden><button class="x" id="infoX" aria-label="Close">×</button><b id="infoT"></b><p id="infoP"></p><a class="go" id="infoGo" href="#">Open</a></aside>
  </section>
  <main class="panel">
    <a class="by" href="/"><img src="/logo.svg" alt="" width="22" height="22">by Alexey Kureev</a>
    <h1>Electronics for a robot arm</h1>
    <p class="sub">From Ohm’s law to the power board of an SO-101 arm. Every level you clear adds its piece to the board on the desk.</p>
    <div class="prog"><div class="segs" id="segs" aria-hidden="true"></div><b id="progT"></b></div>
    <div class="grid" id="levels"></div>
    <details class="invd"><summary>Parts you understand <span id="invN"></span></summary><div class="inv" id="inv"></div></details>
    <p class="foot">Progress is saved in this browser. <button class="ghost" id="reset">Reset progress</button></p>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/so101/so101.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const LEVELS=[
 {t:'The lab',g:'Current, voltage, resistance. Why the LED burnt.',href:'/electronics/lesson0',sec:null},
 {t:'Power input',g:'The board survives a dropped screwdriver and swapped wires.',href:'/electronics/lesson1',sec:0},
 {t:'Capacitor',g:'Servos yank current, but the supply doesn’t sag.',sec:1},
 {t:'Inductor',g:'The inertia of current: you need it to understand a switching converter.',sec:2},
 {t:'Regulator',g:'Making 5 and 3.3 V from 12 V. Why one heats up and the other doesn’t.',sec:3},
 {t:'Transistor switch',g:'Turning a load on and off with a signal.',sec:4},
 {t:'Digital signals',g:'Ones and zeros on a wire: how the servo bus talks.',sec:5},
 {t:'Brain: ESP32',g:'Swapping understood pieces for a microcontroller.',sec:6},
 {t:'Servo bus',g:'The arm gets commands and moves.',sec:7},
 {t:'Your own board',g:'Layout in KiCad, ordering from JLCPCB, first power-up.',sec:'all'}];
const INV=[
 [0,'Voltage','Height: the difference between two points, V'],[0,'Current','Flow: charge per second, A'],[0,'Resistance','Pipe narrowness, Ω. I = U / R'],
 [0,'Power','Heat and work, W. P = U × I'],[0,'Resistor','Sets the current and heats up'],[0,'LED','1.9 V step, doesn’t limit current by itself'],[0,'Multimeter','Measures the difference between probes'],
 [1,'Parallel','One voltage, currents add up'],[1,'Fuse','A deliberately weak point'],[1,'Diode','A check valve with a threshold'],[1,'MOSFET','A valve opened by voltage'],[1,'Divider','A staircase of two resistors'],
 [2,'Capacitor','?'],[3,'Inductor','?'],[4,'Regulator','?'],[5,'Transistor switch','?'],[6,'Digital signal','?'],[7,'ESP32','?'],[8,'Servo bus','?']];
let Q={done:{},steps:{}};try{Q=Object.assign(Q,JSON.parse(localStorage.getItem('quest_v1')||'{}'))}catch(e){}
const isDone=i=>!!(Q.done&&Q.done[i]),built=i=>!!LEVELS[i].href,avail=i=>i===0||isDone(i-1);
const nDone=LEVELS.filter((_,i)=>isDone(i)).length;
$('#segs').innerHTML=LEVELS.map((_,i)=>`<i class="${isDone(i)?'d':avail(i)&&built(i)?'c':''}"></i>`).join('');$('#progT').textContent=`${nDone} / ${LEVELS.length}`;
$('#levels').innerHTML=LEVELS.map((L,i)=>{const d=isDone(i),a=avail(i)&&built(i),st=Q.steps&&Q.steps[i]?Q.steps[i].length:0;
  const cls=d?'done':a?'open':'locked',lock=!d&&!a,tag=d?'Cleared':a?(st?'In progress':'Start here'):built(i)?'Unlocks after '+(i-1):'Coming soon';
  const inner=`<span class="art"><img src="/electronics/levels/lv${i}.webp" alt="" loading="lazy" width="320" height="320"></span><span class="meta"><span class="no">Level ${i}</span><span class="t">${L.t}</span><span class="g">${L.g}</span><span class="tag">${tag}</span></span>`;
  return a||d&&built(i)?`<a class="lv ${cls}${a&&!d?' now':''}" href="${L.href}">${inner}</a>`:`<div class="lv ${cls}" aria-disabled="true">${inner}</div>`}).join('');
$('#invN').textContent=`${INV.filter(([l])=>isDone(l)).length} / ${INV.length}`;$('#inv').innerHTML=INV.map(([l,n,d])=>isDone(l)?`<div class="card"><b>${n}</b><span>${d}</span></div>`:`<div class="card lock"><b>${n}</b><span>level ${l}</span></div>`).join('');
let armed=false;$('#reset').onclick=e=>{if(!armed){armed=true;e.target.textContent='Reset for sure? Click again';return}try{localStorage.removeItem('quest_v1')}catch(_){}location.reload()};

if(!window.THREE||!THREE.OrbitControls){$('#stage').insertAdjacentHTML('beforeend','<div class="err">3D failed to load. The levels are on the right.</div>')}
else{
const stage=$('#stage'),cv=$('#gl'),V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const gl=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});gl.toneMapping=THREE.ACESFilmicToneMapping;gl.setPixelRatio(Math.min(devicePixelRatio,2));gl.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0x9fb2ff,0x050817,0.5));const sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(-5,10,7);scene.add(sun);
{const a=new THREE.DirectionalLight(0x5b9cff,1.9);a.position.set(6,5,-9);scene.add(a);const b=new THREE.DirectionalLight(0x9a7bff,1.3);b.position.set(-9,4,-6);scene.add(b);const lamp=new THREE.PointLight(0xffb26b,.9,14);lamp.position.set(6.5,3.2,-2.5);scene.add(lamp)}
const cam=new THREE.PerspectiveCamera(40,1,0.1,120),ctl=new THREE.OrbitControls(cam,cv);
ctl.enableDamping=true;ctl.enablePan=false;ctl.minDistance=6;ctl.maxDistance=30;ctl.minPolarAngle=0.5;ctl.maxPolarAngle=1.35;ctl.minAzimuthAngle=-0.9;ctl.maxAzimuthAngle=0.9;
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6},o||{}));
const box=(w,h,d,mat,x,y,z,par)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);(par||scene).add(m);return m};
const cyl=(r,h,mat,x,y,z,par,rz)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,28),mat);m.position.set(x,y,z);if(rz)m.rotation.z=rz;(par||scene).add(m);return m};
/* engineering desk: dark top with a lit front edge, a cutting mat under the board */
const B0X=-0.8+2*1.8;box(18,0.35,10.5,new THREE.MeshLambertMaterial({color:0x010103}),0,-0.175,-0.2);box(18,0.04,0.06,M(0x8fa6ff,{emissive:0x5b9cff,emissiveIntensity:.35}),0,-0.02,5.05);
{const mat=box(8.6,0.02,5.8,new THREE.MeshLambertMaterial({color:0x00020a}),B0X+0.1,0.012,-0.85);const g=new THREE.GridHelper(8,16,0x33407a,0x1a2350);g.material.transparent=true;g.material.opacity=.16;g.scale.set(1.075,1,.725);g.position.set(B0X+0.1,0.025,-0.85);scene.add(g)}

const narrow=document.getElementById('stage').clientWidth<600,labels=[],lab=(t,p,cls)=>{const el=document.createElement('div');el.className='lb '+(cls||'');el.textContent=t;$('#labels').appendChild(el);labels.push({el,p});return el};

/* board with 8 sections */
const B0=V3(-0.8,0,-1.9),CW=1.8,CD=2.3,hits=[];
const all=isDone(9);
box(4*CW+0.4,0.1,2*CD+0.4,new THREE.MeshStandardMaterial({color:0x01030e,transparent:!all,opacity:all?1:.28,roughness:.85}),B0.x+2*CW,0.05,B0.z+CD);
const mCu=M(0xe39a52,{metalness:.5,roughness:.35}),mGold=M(0xd9b45a,{metalness:.6,roughness:.3});
function sectionParts(i,g){const r=n=>Math.sin(i*12.9898+n*78.233)*0.5+0.5;
  for(let k=0;k<3;k++)box(CW*0.8,0.02,0.07,mCu,0,0.12,-0.7+k*0.6,g);
  if(i===0){cyl(0.13,0.6,M(0xddeeff,{transparent:true,opacity:.5}),-0.3,0.25,-0.4,g,Math.PI/2);box(0.5,0.16,0.45,M(0x161616),0.35,0.18,-0.4,g);box(0.6,0.4,0.9,M(0xf2c230),-0.45,0.3,0.55,g)}
  else for(let k=0;k<4;k++){const t=Math.floor(r(k)*3);if(t===0)cyl(0.18,0.35,M(0x2a4a8a),-0.5+k*0.33,0.28,0.3,g);else if(t===1)box(0.3,0.14,0.2,M(0x9a6a40),-0.5+k*0.33,0.17,0.35,g);else box(0.45,0.12,0.45,M(0x161616),-0.5+k*0.33,0.16,0.3,g)}
  if(i===6){box(1.1,0.16,1.3,M(0x30353a),0,0.18,0,g);box(0.8,0.1,0.8,M(0xb8c0c4,{metalness:.7}),0,0.3,-0.1,g)}
  if(i===7)box(0.5,0.35,1.0,M(0x222222),0.5,0.28,0,g)}
const SECN=['Power input','Capacitors','Inductor','Regulator','Switches','Signals','ESP32 brain','Servo bus'];
const secLevel=s=>LEVELS.findIndex(L=>L.sec===s);
for(let s=0;s<8;s++){const c=s%4,rw=Math.floor(s/4),cx=B0.x+0.2+c*CW+CW/2,cz=B0.z+0.2+rw*CD+CD/2,lv=secLevel(s),d=isDone(lv),a=avail(lv)&&built(lv);
  const g=new THREE.Group();g.position.set(cx,0,cz);scene.add(g);
  if(d){box(CW-0.08,0.04,CD-0.08,M(0x060d33,{roughness:.8}),0,0.1,0,g);sectionParts(s,g)}
  else{const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(CW-0.12,0.02,CD-0.12)),new THREE.LineDashedMaterial({color:a?0xffc14d:0x55705f,dashSize:0.15,gapSize:0.1}));e.computeLineDistances();e.position.y=0.12;g.add(e)}

const mm=box(1.1,0.25,1.6,M(0xffb26b,{emissive:0xffb26b,emissiveIntensity:.15}),-6.2,0.12,3.0);mm.userData.lv=0;hits.push(mm);
box(0.8,0.02,0.5,M(isDone(0)?0xb8c9a2:0x56604a,{emissive:isDone(0)?0x4a5a30:0,emissiveIntensity:.4}),-6.2,0.26,2.7);
lab(narrow?'0':isDone(0)?'0 · The lab ✓':'0 · The lab',V3(-6.2,0.4,3.9),isDone(0)?'done':'open');
/* the arm */
const powered=isDone(1),alive=isDone(8);
let arm=null;const armHolder=new THREE.Object3D();armHolder.rotation.x=-Math.PI/2;armHolder.rotation.z=-0.5;armHolder.scale.setScalar(15);armHolder.position.set(-5.2,0,-1.0);scene.add(armHolder);

{const p=[V3(B0.x+0.2+3*CW+CW/2,0.15,B0.z+0.2+CD+CD/2),V3(1.5,0.12,3.6),V3(-3.5,0.12,3.2),V3(-5.2,0.12,0.0)];

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null;
cv.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);

const FC=V3(0.1,0.9,0.3),FD=V3(0.12,0.55,1);

let lastW=0;function size(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;gl.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();if(Math.abs(w-lastW)>40){lastW=w;fit()}}
